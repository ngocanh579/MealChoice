<!-- Fragment Card Món Ăn -->
<div th:fragment="foodCard(food)" class="col" th:if="${food != null}" xmlns:th="http://www.thymeleaf.org">
    <div class="card h-100 border-0 shadow-sm rounded-4 overflow-hidden food-card position-relative transition-hover">

        <!-- Badges: Discount & Tag -->
        <div class="position-absolute top-0 start-0 m-3 z-2 d-flex flex-column gap-1">
            <!-- Tính % giảm giá nếu có discountPrice -->
            <span th:if="${food.discountPrice != null and food.price != null and food.price > 0}"
                  class="badge bg-danger text-white rounded-pill px-2.5 py-1.5 shadow-sm fw-semibold"
                  th:text="'-' + ${#numbers.formatDecimal((food.price - food.discountPrice) / food.price * 100, 0, 0)} + '%'">-20%</span>

            <!-- Hiển thị Tag đầu tiên nếu có danh sách tags -->
            <span th:if="${food.tags != null and !#lists.isEmpty(food.tags)}"
                  class="badge bg-dark bg-opacity-75 text-white rounded-pill px-2 py-1 shadow-sm fs-8"
                  th:text="${food.tags[0].tagName}">Nổi bật</span>
        </div>

        <!-- Button Wishlist (Food Likes) -->
        <button type="button"
                class="btn btn-light rounded-circle shadow-sm position-absolute top-0 end-0 m-3 z-2 p-2 d-flex align-items-center justify-content-center text-danger border-0 btn-wishlist"
                th:data-food-id="${food.id}"
                style="width: 36px; height: 36px;"
                th:title="${likedFoodIds != null and likedFoodIds.contains(food.id)} ? 'Bỏ yêu thích' : 'Yêu thích'">
            <i th:class="${likedFoodIds != null and likedFoodIds.contains(food.id)} ? 'bi bi-heart-fill fs-6' : 'bi bi-heart fs-6'"></i>
        </button>

        <!-- Image Món Ăn (Lấy ảnh từ danh sách images hoặc ảnh mặc định) -->
        <a th:href="@{/foods/{id}(id=${food.id})}">
            <div class="ratio ratio-4x3 position-relative overflow-hidden bg-light">
                <!-- Trường hợp dùng DTO/Entity chứa danh sách images -->
                <th:block th:if="${food.images != null and !#lists.isEmpty(food.images)}">
                    <img th:src="${food.images[0].imageUrl}"
                         class="card-img-top object-fit-cover food-card-img"
                         th:alt="${food.foodName}" loading="lazy">
                </th:block>
                <!-- Trường hợp không có ảnh trong DB -> dùng ảnh mặc định -->
                <th:block th:unless="${food.images != null and !#lists.isEmpty(food.images)}">
                    <img src="https://images.unsplash.com/photo-1546069901-ba9599a7e63c?w=600&auto=format&fit=crop&q=80"
                         class="card-img-top object-fit-cover food-card-img"
                         th:alt="${food.foodName != null ? food.foodName : 'Món ăn'}" loading="lazy">
                </th:block>
            </div>
        </a>

        <div class="card-body p-3 d-flex flex-column">
            <!-- Tên Món Ăn (foodName) -->
            <a th:href="@{/foods/{id}(id=${food.id})}" class="text-decoration-none text-dark">
                <h6 class="card-title fw-bold text-dark mb-1 text-truncate"
                    th:text="${food.foodName != null ? food.foodName : 'Tên món ăn'}"
                    th:title="${food.foodName}">Tên món ăn</h6>
            </a>

            <!-- Địa chỉ Quán (Lấy qua merchantAddress) -->
            <p class="card-text text-muted fs-8 mb-2 text-truncate"
               th:title="${food.merchantAddress != null ? food.merchantAddress.merchantAddress : 'Địa chỉ quán'}">
                <i class="bi bi-geo-alt me-1 text-danger"></i>
                <span th:text="${food.merchantAddress != null ? food.merchantAddress.merchantAddress : 'Chưa có địa chỉ'}">Địa chỉ quán</span>
            </p>

            <!-- Rating & Preparation Time & Category Tag -->
            <div class="d-flex align-items-center justify-content-between text-muted fs-8 mb-2 pb-2 border-bottom">
                <div class="d-flex align-items-center gap-1.5">
                    <span class="d-inline-flex align-items-center gap-1 text-warning fw-bold fs-8">
                        <i class="bi bi-star-fill"></i>
                        <span class="text-dark">4.5</span>
                        <span class="text-muted fw-normal fs-9">(100+)</span>
                    </span>
                    <span class="text-muted mx-1">•</span>
                    <span class="d-flex align-items-center gap-1">
                        <i class="bi bi-clock-history text-primary"></i>
                        <span th:text="${food.preparationTime != null ? food.preparationTime + 'p' : '15-25p'}">15-25p</span>
                    </span>
                </div>

                <!-- Danh mục Món ăn (Lấy danh mục đầu tiên) -->
                <span th:if="${food.foodCategories != null and !#lists.isEmpty(food.foodCategories)}"
                      class="badge bg-light text-secondary border rounded-pill px-2"
                      th:text="${food.foodCategories[0].categoryName}">Món chính</span>
            </div>

            <!-- Giá tiền (price & discount_price) -->
            <div class="mt-auto pt-1">
                <div class="d-flex align-items-baseline gap-2">
                    <!-- Nếu có discount_price thì hiển thị discount_price, ngược lại hiển thị price -->
                    <span class="fw-bold fs-6 text-danger"
                          th:text="${food.discountPrice != null ? #numbers.formatDecimal(food.discountPrice, 0, 'COMMA', 0, 'POINT') + ' đ' : #numbers.formatDecimal(food.price, 0, 'COMMA', 0, 'POINT') + ' đ'}">
                          45.000 đ
                    </span>

                    <!-- Giá gốc bị gạch ngang khi có discount_price -->
                    <span th:if="${food.discountPrice != null}"
                          class="text-muted text-decoration-line-through fs-8"
                          th:text="${#numbers.formatDecimal(food.price, 0, 'COMMA', 0, 'POINT') + ' đ'}">
                          60.000 đ
                    </span>
                </div>

                <!-- Ghi chú món ăn (Dùng food_note thay cho coupon) -->
                <div th:if="${food.foodNote != null and !#strings.isEmpty(food.foodNote)}"
                     class="mt-2 pt-2 border-top border-light-subtle d-flex align-items-center gap-1 text-danger fs-8 fw-semibold">
                    <span class="badge bg-danger bg-opacity-10 text-danger rounded-1 px-1.5 py-0.5">GHI CHÚ</span>
                    <span class="text-truncate" th:text="${food.foodNote}">Ghi chú món ăn</span>
                </div>
            </div>
        </div>
    </div>
</div>
