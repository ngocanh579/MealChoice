<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chi tiết món ăn - Merchant</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/merchant.css}">
</head>
<body class="merchant-page">
<div th:replace="~{merchant/layout :: shell('Chi tiết món ăn', 'foods', ~{::content})}">
    <section th:fragment="content" class="d-flex flex-column gap-4">
        <div class="d-flex flex-column flex-lg-row justify-content-between align-items-lg-center gap-3">
            <div>
                <div class="text-uppercase text-muted small fw-semibold mb-2">Merchant / Món ăn</div>
                <h2 class="fw-bold mb-1" th:text="${food.foodName}">Tên món ăn</h2>
                <p class="merchant-section-subtitle mb-0">Xem thông tin chi tiết của món ăn đang quản lý.</p>
            </div>

            <div class="d-flex gap-2">
                <a href="/merchant/foods" class="btn btn-outline-secondary rounded-pill px-4">
                    <i class="bi bi-arrow-left me-1"></i>
                    Quay lại
                </a>
                <a th:href="@{/merchant/foods/{id}/edit(id=${food.id})}" class="btn btn-warning rounded-pill px-4">
                    <i class="bi bi-pencil me-1"></i>
                    Chỉnh sửa
                </a>
            </div>
        </div>

        <div class="merchant-page-card p-4 p-lg-5">
            <div class="row g-4">
                <div class="col-lg-5">
                    <div th:if="${food.imageUrls != null and !#lists.isEmpty(food.imageUrls)}">

                        <!-- Ảnh chính -->
                        <div class="position-relative rounded-4 overflow-hidden bg-light border mb-3"
                             style="height: 420px;">

                            <button type="button"
                                    id="prevFoodImage"
                                    class="btn btn-light position-absolute top-50 start-0 translate-middle-y rounded-circle shadow-sm ms-3"
                                    style="z-index: 2;"
                                    aria-label="Ảnh trước">
                                <i class="bi bi-chevron-left"></i>
                            </button>

                            <img id="mainFoodImage"
                                 th:src="${food.imageUrls[0]}"
                                 alt="Ảnh món ăn"
                                 class="w-100 h-100 object-fit-contain"
                                 style="cursor: zoom-in;"
                                 data-bs-toggle="modal"
                                 data-bs-target="#foodImageModal">

                            <button type="button"
                                    id="nextFoodImage"
                                    class="btn btn-light position-absolute top-50 end-0 translate-middle-y rounded-circle shadow-sm me-3"
                                    style="z-index: 2;"
                                    aria-label="Ảnh tiếp theo">
                                <i class="bi bi-chevron-right"></i>
                            </button>
                        </div>

                        <!-- Ảnh nhỏ -->
                        <div class="row g-2">
                            <div th:each="imageUrl, stat : ${food.imageUrls}"
                                 class="col-3">

                                <button type="button"
                                        class="food-thumbnail border rounded-3 overflow-hidden p-0 bg-light w-100"
                                        th:classappend="${stat.index == 0 ? 'active' : ''}"
                                        th:attr="data-index=${stat.index}"
                                        style="height: 90px;">

                                    <img th:src="${imageUrl}"
                                         alt="Ảnh món ăn"
                                         class="w-100 h-100 object-fit-contain">
                                </button>

                            </div>
                        </div>

                    </div>

                    <!-- Không có ảnh -->
                    <div th:unless="${food.imageUrls != null and !#lists.isEmpty(food.imageUrls)}"
                         class="rounded-4 overflow-hidden bg-light border d-flex align-items-center justify-content-center text-muted"
                         style="min-height: 420px;">
                        <div class="text-center">
                            <i class="bi bi-image fs-1 d-block mb-2"></i>
                            Chưa có ảnh
                        </div>
                    </div>
                </div>

                <div class="col-lg-7">
                    <div class="merchant-panel p-4 h-100">
                        <div class="d-flex flex-wrap gap-2 mb-4">
                            <span class="badge text-bg-danger rounded-pill px-3 py-2">
                                <i class="bi bi-coin me-1"></i>
                                <span th:text="${#numbers.formatDecimal(food.price, 0, 'COMMA', 0, 'POINT')} + ' đ'">0 đ</span>
                            </span>

                            <span th:if="${food.discountPrice != null}" class="badge text-bg-success rounded-pill px-3 py-2">
                                <i class="bi bi-tag me-1"></i>
                                <span th:text="${#numbers.formatDecimal(food.discountPrice, 0, 'COMMA', 0, 'POINT')} + ' đ'">0 đ</span>
                            </span>

                            <span class="badge text-bg-light border text-dark rounded-pill px-3 py-2">
                                <i class="bi bi-clock me-1"></i>
                                <span th:text="${food.preparationTime != null ? food.preparationTime + ' phút' : '-'}">-</span>
                            </span>
                        </div>

                        <div class="row g-3 mb-4">
                            <div class="col-sm-6">
                                <div class="merchant-stat h-100">
                                    <div class="label">Địa chỉ</div>
                                    <div class="fw-semibold mt-1" th:text="${food.merchantAddress != null ? food.merchantAddress : 'Chưa cập nhật'}">
                                        Chưa cập nhật
                                    </div>
                                </div>
                            </div>
                            <div class="col-sm-6">
                                <div class="merchant-stat h-100">
                                    <div class="label">Danh mục</div>

                                    <div class="fw-semibold mt-1">
                                        <span th:if="${food.categoryNames != null and !#lists.isEmpty(food.categoryNames)}"
                                            th:text="${#strings.listJoin(food.categoryNames, ', ')}">
                                            Dinner
                                        </span>

                                        <span th:unless="${food.categoryNames != null and !#lists.isEmpty(food.categoryNames)}">
                                            Chưa có danh mục
                                        </span>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div class="mb-4">
                            <h5 class="fw-bold mb-2">Ghi chú</h5>
                            <p class="text-muted mb-0"
                               th:text="${food.foodNote != null and !food.foodNote.isBlank() ? food.foodNote : 'Không có ghi chú cho món ăn này.'}">
                                Không có ghi chú cho món ăn này.
                            </p>
                        </div>

                        <div class="row g-3">
                            <div class="col-md-4">
                                <div class="merchant-stat">
                                    <div class="label">Lượt xem</div>
                                    <div class="value" th:text="${food.views}">0</div>
                                </div>
                            </div>
                            <div class="col-md-4">
                                <div class="merchant-stat">
                                    <div class="label">Đơn hàng</div>
                                    <div class="value" th:text="${food.orderCount}">0</div>
                                </div>
                            </div>
                            <div class="col-md-4">
                                <div class="merchant-stat">
                                    <div class="label">Đề xuất</div>
                                    <div class="value" th:text="${food.isRecommended ? 'Có' : 'Không'}">Không</div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="row g-3 mt-4">
                <div class="col-md-6">
                    <div class="merchant-stat">
                        <div class="label">Ngày tạo</div>
                        <div class="fw-semibold mt-1"
                             th:text="${food.createdAt != null ? #temporals.format(food.createdAt, 'dd/MM/yyyy HH:mm') : '-'}">
                            -
                        </div>
                    </div>
                </div>
                <div class="col-md-6">
                    <div class="merchant-stat">
                        <div class="label">Cập nhật gần nhất</div>
                        <div class="fw-semibold mt-1"
                             th:text="${food.updatedAt != null ? #temporals.format(food.updatedAt, 'dd/MM/yyyy HH:mm') : '-'}">
                            -
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>
</div>
<div class="modal fade"
     id="foodImageModal"
     tabindex="-1"
     aria-hidden="true">

    <div class="modal-dialog modal-dialog-centered modal-xl">
        <div class="modal-content bg-dark border-0">

            <div class="modal-header border-0">
                <button type="button"
                        class="btn-close btn-close-white ms-auto"
                        data-bs-dismiss="modal"
                        aria-label="Đóng">
                </button>
            </div>

            <div class="modal-body position-relative text-center p-2">

                <button type="button"
                        id="modalPrevFoodImage"
                        class="btn btn-light position-absolute top-50 start-0 translate-middle-y rounded-circle"
                        aria-label="Ảnh trước">
                    <i class="bi bi-chevron-left"></i>
                </button>

                <img id="modalFoodImage"
                     src=""
                     alt="Ảnh món ăn"
                     class="img-fluid"
                     style="max-height: 80vh; object-fit: contain;">

                <button type="button"
                        id="modalNextFoodImage"
                        class="btn btn-light position-absolute top-50 end-0 translate-middle-y rounded-circle"
                        aria-label="Ảnh tiếp theo">
                    <i class="bi bi-chevron-right"></i>
                </button>

            </div>

        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<script th:inline="javascript">
    const foodImages = /*[[${food.imageUrls}]]*/ [];

    let currentImageIndex = 0;

    const mainFoodImage = document.getElementById("mainFoodImage");
    const modalFoodImage = document.getElementById("modalFoodImage");

    const thumbnails = document.querySelectorAll(".food-thumbnail");

    function showFoodImage(index) {
        if (!foodImages.length) {
            return;
        }

        currentImageIndex =
            (index + foodImages.length) % foodImages.length;

        mainFoodImage.src = foodImages[currentImageIndex];

        thumbnails.forEach((thumbnail, thumbnailIndex) => {
            thumbnail.classList.toggle(
                "active",
                thumbnailIndex === currentImageIndex
            );
        });
    }

    function showModalFoodImage() {
        if (!modalFoodImage) {
            return;
        }

        modalFoodImage.src = foodImages[currentImageIndex];
    }

    thumbnails.forEach((thumbnail) => {
        thumbnail.addEventListener("click", () => {
            const index = Number(thumbnail.dataset.index);

            showFoodImage(index);
        });
    });

    document.getElementById("prevFoodImage")?.addEventListener(
        "click",
        () => {
            showFoodImage(currentImageIndex - 1);
        }
    );

    document.getElementById("nextFoodImage")?.addEventListener(
        "click",
        () => {
            showFoodImage(currentImageIndex + 1);
        }
    );

    mainFoodImage?.addEventListener("click", () => {
        showModalFoodImage();
    });

    document.getElementById("modalPrevFoodImage")?.addEventListener(
        "click",
        () => {
            showFoodImage(currentImageIndex - 1);
            showModalFoodImage();
        }
    );

    document.getElementById("modalNextFoodImage")?.addEventListener(
        "click",
        () => {
            showFoodImage(currentImageIndex + 1);
            showModalFoodImage();
        }
    );
</script>
</body>
</html>
