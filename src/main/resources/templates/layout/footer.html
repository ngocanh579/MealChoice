<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
</head>
<body>
<footer th:fragment="footer" class="bg-dark text-white pt-4 pb-3 mt-auto">
    <div class="container text-center text-md-start">
        <div class="row">
            <div class="col-md-5 mb-3">
                <h5 class="text-uppercase fw-bold text-warning" th:text="${footerInfo.companyName}">Trưa Nay Ăn Gì</h5>
                <p>Nền tảng kết nối ẩm thực trưa chất lượng, nhanh chóng và tiện lợi cho dân văn phòng.</p>
            </div>
            <div class="col-md-4 mb-3">
                <h5 class="text-uppercase fw-bold text-warning">Liên Hệ</h5>
                <p class="mb-1"><i class="bi bi-geo-alt-fill me-2"></i>Địa chỉ: <span th:text="${footerInfo.address}"></span></p>
                <p class="mb-1"><i class="bi bi-telephone-fill me-2"></i>Hotline: <span th:text="${footerInfo.phone}"></span></p>
                <p class="mb-1"><i class="bi bi-envelope-fill me-2"></i>Email: <span th:text="${footerInfo.email}"></span></p>
            </div>
            <div class="col-md-3 mb-3">
                <h5 class="text-uppercase fw-bold text-warning">Chính Sách</h5>
                <ul class="list-unstyled">
                    <li><a href="#" class="text-white text-decoration-none">Điều khoản sử dụng</a></li>
                    <li><a href="#" class="text-white text-decoration-none">Chính sách bảo mật</a></li>
                </ul>
            </div>
        </div>
        <hr class="mb-3">
        <div class="text-center">
            <p class="mb-0" th:text="${footerInfo.copyright}"></p>
        </div>
    </div>
</footer>
</body>
</html>
