<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trang chủ Merchant - Merchant</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/merchant.css}">
</head>

<body class="merchant-page">
<div th:replace="~{merchant/layout :: shell('Trang chủ Merchant', 'dashboard', ~{::content})}">
    <section th:fragment="content" class="d-flex flex-column gap-4">

        <div class="merchant-stats-grid" id="overview">

            <div class="merchant-stat merchant-stat--red">
                <div class="label">Tổng số món ăn</div>
                <div class="value"
                     th:text="${foodCount != null ? foodCount + ' món' : '0 món'}">
                    0 món
                </div>
            </div>

            <div class="merchant-stat merchant-stat--orange">
                <div class="label">Doanh thu hôm nay</div>
                <div class="value"
                     th:text="${todayRevenue != null ? todayRevenue + ' VNĐ' : '0 VNĐ'}">
                    0 VNĐ
                </div>
            </div>

            <div class="merchant-stat merchant-stat--blue">
                <div class="label">Lượt xem quán</div>
                <div class="value"
                     th:text="${shopViewCount != null ? shopViewCount + ' lượt' : '0 lượt'}">
                    0 lượt
                </div>
            </div>
        </div>



    </section>
</div>
</body>
</html>
