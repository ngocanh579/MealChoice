<!-- Fragment Danh Sách Toàn Bộ Món Ăn (Phân trang 30 món/trang) -->
<section th:fragment="foodList" class="all-foods-section py-4 mb-5" xmlns:th="http://www.thymeleaf.org">
    <div class="container">
        <!-- Section Header -->
        <div class="d-flex flex-wrap align-items-end justify-content-between mb-4 gap-2 border-bottom pb-3">
            <div>
                <h3 class="fw-bold text-dark mb-0">Gợi ý món ăn hôm nay</h3>
                <p class="text-muted fs-8 mb-0 mt-1">Khám phá hàng ngàn món ăn phong phú đa dạng từ các quán ăn uy tín
                </p>
            </div>

            <div class="text-muted fs-8" th:if="${foodPage != null}">
                Hiển thị <span class="fw-bold text-dark" th:text="${foodPage.numberOfElements}">30</span> / <span
                    class="fw-bold text-dark" th:text="${foodPage.totalElements}">32</span> món
            </div>
        </div>

        <!-- Foods Grid (30 Items / Page) -->
        <div class="row row-cols-1 row-cols-sm-2 row-cols-md-3 row-cols-lg-4 g-4" id="allFoodsGrid">
            <th:block th:if="${foodPage != null and !foodPage.isEmpty()}">
                <div class="col" th:each="food : ${foodPage.content}" th:if="${food != null}">
                    <div
                            class="card h-100 border-0 shadow-sm rounded-4 overflow-hidden food-card position-relative transition-hover">
                        <!-- Badges -->
                        <div class="position-absolute top-0 start-0 m-3 z-2 d-flex flex-column gap-1">
                            <span th:if="${food.discountPercentage != null}"
                                  class="badge bg-danger text-white rounded-pill px-2.5 py-1.5 shadow-sm fw-semibold"
                                  th:text="'-' + ${food.discountPercentage} + '%'">
                                -20%
                            </span>
                            <span th:if="${food.tag != null and !#strings.isEmpty(food.tag) and !#strings.containsIgnoreCase(food.tag, 'giảm') and !#strings.containsIgnoreCase(food.tag, '%')}"
                                  class="badge bg-dark bg-opacity-75 text-white rounded-pill px-2 py-1 shadow-sm fs-8"
                                  th:text="${food.tag}">
                                Nổi bật
                            </span>
                        </div>

                        <button type="button"
                                class="btn btn-light rounded-circle shadow-sm position-absolute top-0 end-0 m-3 z-2 p-2 d-flex align-items-center justify-content-center text-danger border-0 btn-wishlist"
                                style="width: 36px; height: 36px;" title="Yêu thích">
                            <i class="bi bi-heart-fill fs-6"></i>
                        </button>

                        <!-- Food Image with Link -->
                        <a th:href="@{/foods/{id}(id=${food.id})}" class="ratio ratio-4x3 position-relative overflow-hidden bg-light d-block text-decoration-none">
                            <img th:src="${food.imageUrl != null and !#strings.isEmpty(food.imageUrl)} ? ${food.imageUrl} : 'https://images.unsplash.com/photo-1546069901-ba9599a7e63c?w=600&auto=format&fit=crop&q=80'"
                                 class="card-img-top object-fit-cover food-card-img w-100 h-100"
                                 th:alt="${food.name != null ? food.name : 'Món ăn'}" loading="lazy">
                        </a>

                        <!-- Food Body Details -->
                        <div class="card-body p-3 d-flex flex-column">
                            <h6 class="card-title fw-bold mb-1 text-truncate">
                                <a th:href="@{/foods/{id}(id=${food.id})}" class="text-dark text-decoration-none"
                                   th:text="${food.name != null ? food.name : 'Tên món ăn'}"
                                   th:title="${food.name != null ? food.name : 'Tên món ăn'}">
                                    Tên món ăn
                                </a>
                            </h6>

                            <p class="card-text text-muted fs-8 mb-2 text-truncate"
                               th:text="${food.address != null ? food.address : 'Địa chỉ quán'}"
                               th:title="${food.address != null ? food.address : 'Địa chỉ quán'}">
                                <i class="bi bi-geo-alt me-1 text-danger"></i>Địa chỉ quán
                            </p>

                            <!-- Rating & Prep Time & Category Tag -->
                            <div
                                    class="d-flex align-items-center justify-content-between text-muted fs-8 mb-2 pb-2 border-bottom">
                                <div class="d-flex align-items-center gap-1.5">
                                    <span class="d-inline-flex align-items-center gap-1 text-warning fw-bold fs-8">
                                        <i class="bi bi-star-fill"></i>
                                        <span class="text-dark">4.5</span>
                                        <span class="text-muted fw-normal fs-9">(100+)</span>
                                    </span>
                                    <span class="text-muted mx-1">•</span>
                                    <span class="d-flex align-items-center gap-1">
                                        <i class="bi bi-clock-history text-primary"></i>
                                        <span
                                                th:text="${food.preparationTime != null ? food.preparationTime + 'p' : '15-25p'}">15-25p</span>
                                    </span>
                                </div>
                                <span class="badge bg-light text-secondary border rounded-pill px-2"
                                      th:text="${food.categoryName}">
                                    Món chính
                                </span>
                            </div>

                            <!-- Price & Coupon -->
                            <div class="mt-auto pt-1">
                                <div class="d-flex align-items-baseline justify-content-between">
                                    <div class="d-flex align-items-baseline gap-2">
                                        <span class="fw-bold fs-6 text-danger"
                                              th:text="${food.formattedDiscountPrice != null ? food.formattedDiscountPrice : food.formattedPrice}">
                                            45.000 đ
                                        </span>
                                        <span th:if="${food.formattedDiscountPrice != null}"
                                              class="text-muted text-decoration-line-through fs-8"
                                              th:text="${food.formattedPrice}">
                                            60.000 đ
                                        </span>
                                    </div>
                                </div>

                                <div
                                        class="mt-2 pt-2 border-top border-light-subtle d-flex align-items-center gap-1 text-danger fs-8 fw-semibold">
                                    <span class="badge bg-danger bg-opacity-10 text-danger rounded-1 px-1.5 py-0.5">ƯU
                                        ĐÃI</span>
                                    <span class="text-truncate" th:text="${food.couponDescription}">Freeship + Giảm
                                        20%</span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </th:block>
            <div th:if="${foodPage == null or foodPage.isEmpty()}" class="col-12 text-center py-5 text-muted">
                <i class="bi bi-egg-fried fs-1 d-block mb-2 text-secondary"></i>
                <p class="mb-0">Hiện chưa có món ăn nào trong hệ thống.</p>
            </div>
        </div>

        <!-- Pagination Controls -->
        <nav th:if="${foodPage != null and foodPage.totalPages > 1}" class="d-flex justify-content-center mt-5"
             aria-label="Food pagination">
            <ul class="pagination pagination-md shadow-sm rounded-pill overflow-hidden border-0">
                <!-- Nút Previous -->
                <li class="page-item" th:classappend="${foodPage.first} ? 'disabled'">
                    <a class="page-link px-3" th:href="@{/(page=${foodPage.number - 1})}" aria-label="Previous">
                        <i class="bi bi-chevron-left"></i>
                    </a>
                </li>

                <!-- Danh sách số trang -->
                <li class="page-item" th:each="pageNum : ${#numbers.sequence(0, foodPage.totalPages - 1)}"
                    th:classappend="${pageNum == foodPage.number} ? 'active'">
                    <a class="page-link px-3" th:href="@{/(page=${pageNum})}" th:text="${pageNum + 1}">1</a>
                </li>

                <!-- Nút Next -->
                <li class="page-item" th:classappend="${foodPage.last} ? 'disabled'">
                    <a class="page-link px-3" th:href="@{/(page=${foodPage.number + 1})}" aria-label="Next">
                        <i class="bi bi-chevron-right"></i>
                    </a>
                </li>
            </ul>
        </nav>
    </div>
</section>
