    <!-- Script xử lý đăng xuất trực tiếp trong navbar -->
    <script>
        async function handleLogout(e) {
            e.preventDefault();
            if (confirm("Bạn có chắc chắn muốn đăng xuất không?")) {
                try {
                    await fetch('/api/auth/logout', {
                        method: 'POST'
                    });
                } catch (error) {
                    console.error("Lỗi đăng xuất:", error);
                } finally {
                    // Xóa cookie accessToken và localStorage
                    document.cookie = "accessToken=; path=/; expires=Thu, 01 Jan 1970 00:00:00 UTC;";
                    localStorage.clear();
                    window.location.href = "/login";
                }
            }
        }
    </script>

    <script>
        // Hiển thị giao diện người dùng dựa trên trạng thái Đăng nhập
        const displayName = localStorage.getItem('displayName');
        const guestNav = document.getElementById('guestNav');
        const userProfileNav = document.getElementById('userProfileNav');

        if (displayName) {
            if (guestNav) guestNav.classList.add('d-none');
            if (userProfileNav) userProfileNav.classList.remove('d-none');
            const nameEl = document.getElementById('userDisplayName');
            if (nameEl) nameEl.innerText = displayName;
        } else {
            if (guestNav) guestNav.classList.remove('d-none');
            if (userProfileNav) userProfileNav.classList.add('d-none');
        }

        // Kiểm tra Roles từ localStorage hoặc JwtToken
        let roles = [];
        const userRolesStr = localStorage.getItem('userRoles');
        if (userRolesStr) {
            try { roles = JSON.parse(userRolesStr); } catch (e) {}
        }
        
        // Nếu đăng nhập tài khoản Admin admin@mealchoice.com
        if (displayName === 'Admin' || roles.includes('ROLE_ADMIN') || roles.includes('ADMIN')) {
            const adminNav = document.getElementById('adminRoleNav');
            if (adminNav) adminNav.classList.remove('d-none');
        }
        if (roles.includes('ROLE_MERCHANT') || roles.includes('MERCHANT')) {
            const merchantNav = document.getElementById('merchantRoleNav');
            if (merchantNav) merchantNav.classList.remove('d-none');
        }
    </script>
