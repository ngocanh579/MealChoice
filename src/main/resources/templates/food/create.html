<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Thêm món ăn - MealChoice</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>

<body class="bg-light">

<div th:replace="~{layout/navbar :: navbar}"></div>

<div class="container py-4">

    <div class="d-flex justify-content-between align-items-center mb-4">

        <div>
            <h3 class="fw-bold text-danger mb-1">
                <i class="bi bi-plus-circle me-2"></i>
                Thêm Món Ăn
            </h3>

            <p class="text-muted mb-0">
                Nhập thông tin món ăn mới.
            </p>
        </div>

        <a href="/merchant/foods"
           class="btn btn-outline-secondary rounded-pill px-3">

            <i class="bi bi-arrow-left me-1"></i>
            Quay lại danh sách

        </a>

    </div>


    <div id="alertContainer"></div>


    <div class="card border-0 shadow-sm rounded-4">

        <div class="card-body p-4">

            <form id="createFoodForm"
                  th:data-merchant-id="${merchant.id}">

                <div class="mb-3">

                    <label class="form-label fw-semibold">
                        Tên món ăn
                        <span class="text-danger">*</span>
                    </label>

                    <input type="text"
                           class="form-control"
                           id="foodName"
                           placeholder="Ví dụ: Cơm rang"
                           required>

                </div>


                <div class="row">

                    <div class="col-md-6 mb-3">

                        <label class="form-label fw-semibold">
                            Giá món ăn
                            <span class="text-danger">*</span>
                        </label>

                        <input type="number"
                               class="form-control"
                               id="price"
                               min="0"
                               placeholder="Ví dụ: 30000"
                               required>

                    </div>


                    <div class="col-md-6 mb-3">

                        <label class="form-label fw-semibold">
                            Giá giảm
                        </label>

                        <input type="number"
                               class="form-control"
                               id="discountPrice"
                               min="0"
                               placeholder="Ví dụ: 25000">

                    </div>

                </div>


                <div class="row">

                    <div class="col-md-6 mb-3">

                        <label class="form-label fw-semibold">
                            Thời gian chuẩn bị
                        </label>

                        <input type="number"
                               class="form-control"
                               id="preparationTime"
                               min="0"
                               placeholder="Ví dụ: 15">

                        <div class="form-text">
                            Đơn vị: phút
                        </div>

                    </div>


                    <div class="col-md-6 mb-3">

                        <label class="form-label fw-semibold">
                            Phí dịch vụ
                        </label>

                        <input type="number"
                               class="form-control"
                               id="serviceFee"
                               min="0"
                               value="0">

                    </div>

                </div>


                <div class="mb-3">

                    <label class="form-label fw-semibold">
                        Địa chỉ bán món
                        <span class="text-danger">*</span>
                    </label>

                    <select class="form-select"
                            id="merchantAddressId"
                            required>

                        <option value="">
                            Chọn địa chỉ nhà hàng
                        </option>

                        <option th:each="address : ${merchant.addresses}"
                                th:value="${address.id}"
                                th:text="${address.merchantAddress}">
                        </option>

                    </select>

                </div>


                <div class="mb-3">

                    <label class="form-label fw-semibold">
                        Danh mục món ăn
                        <span class="text-danger">*</span>
                    </label>

                    <div id="categoryContainer">

                        <div th:each="category : ${categories}"
                             class="form-check">

                            <input class="form-check-input category-checkbox"
                                   type="checkbox"
                                   th:value="${category.id}"
                                   th:id="'category-' + ${category.id}">

                            <label class="form-check-label"
                                   th:for="'category-' + ${category.id}"
                                   th:text="${category.name}">
                                Món Việt
                            </label>

                        </div>

                    </div>

                </div>


                <div class="mb-4">

                    <label class="form-label fw-semibold">
                        Ghi chú món ăn
                    </label>

                    <textarea class="form-control"
                              id="foodNote"
                              rows="4"
                              placeholder="Ví dụ: Không cay, ít dầu..."></textarea>

                </div>


                <div class="d-flex justify-content-end gap-2">

                    <a href="/merchant/foods"
                       class="btn btn-light rounded-pill px-4">
                        Hủy
                    </a>

                    <button type="submit"
                            class="btn btn-danger rounded-pill px-4 fw-semibold">

                        <i class="bi bi-check-circle me-1"></i>
                        Lưu món ăn

                    </button>

                </div>

            </form>

        </div>

    </div>

</div>


<div th:replace="~{layout/footer :: footer}"></div>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>


<script>

    function showAlert(type, message) {

        const container =
            document.getElementById("alertContainer");

        container.innerHTML =
            `<div class="alert alert-${type === "success" ? "success" : "danger"}">
                ${message}
            </div>`;
    }


    document.getElementById("createFoodForm")
        .addEventListener("submit", async function (event) {

            event.preventDefault();


            const merchantId =
                this.dataset.merchantId;


            const categoryIds =
                Array.from(
                    document.querySelectorAll(
                        ".category-checkbox:checked"
                    )
                ).map(item => item.value);


            if (categoryIds.length === 0) {

                showAlert(
                    "error",
                    "Vui lòng chọn ít nhất một danh mục."
                );

                return;
            }


            const discountValue =
                document.getElementById(
                    "discountPrice"
                ).value;


            const preparationValue =
                document.getElementById(
                    "preparationTime"
                ).value;


            const serviceFeeValue =
                document.getElementById(
                    "serviceFee"
                ).value;


            const payload = {

                foodName:
                    document.getElementById(
                        "foodName"
                    ).value.trim(),

                merchantAddressId:
                document.getElementById(
                    "merchantAddressId"
                ).value,

                categoryIds:
                categoryIds,

                preparationTime:
                    preparationValue
                        ? Number(preparationValue)
                        : null,

                foodNote:
                    document.getElementById(
                        "foodNote"
                    ).value.trim(),

                price:
                    Number(
                        document.getElementById(
                            "price"
                        ).value
                    ),

                discountPrice:
                    discountValue
                        ? Number(discountValue)
                        : null,

                serviceFee:
                    serviceFeeValue
                        ? Number(serviceFeeValue)
                        : 0

            };


            if (!payload.foodName) {

                showAlert(
                    "error",
                    "Tên món ăn không được để trống."
                );

                return;
            }


            if (!payload.merchantAddressId) {

                showAlert(
                    "error",
                    "Vui lòng chọn địa chỉ bán món."
                );

                return;
            }


            try {

                const response =
                    await fetch(
                        `/api/merchant/${merchantId}/foods`,
                        {

                            method: "POST",

                            headers: {
                                "Content-Type": "application/json"
                            },

                            body:
                                JSON.stringify(payload)

                        }
                    );


                if (!response.ok) {

                    throw new Error(
                        await response.text()
                    );

                }


                showAlert(
                    "success",
                    "Thêm món ăn thành công."
                );


                setTimeout(
                    () => {
                        window.location.href =
                            "/merchant/foods";
                    },
                    700
                );

            } catch (error) {

                showAlert(
                    "error",
                    "Không thể thêm món ăn: " +
                    error.message
                );

            }

        });

</script>

</body>
</html>
