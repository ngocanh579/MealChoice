<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${food.name} + ' - Chi tiết món ăn | MealChoice'">Chi Tiết Món Ăn - MealChoice</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">

    <!-- Homepage Custom CSS (Để dùng các style card chung) -->
    <link rel="stylesheet" th:href="@{/css/homepage.css}">
    
    <style>
        /* Custom Premium styling for Detail Page */
        .btn-wishlist-detail:hover {
            background-color: #fff0f2 !important;
            border-color: #ff4d6d !important;
        }
        .food-detail-carousel-img {
            transition: all 0.5s ease;
        }
        .food-detail-carousel-img:hover {
            transform: scale(1.02);
        }
        .border-dashed {
            border-style: dashed !important;
        }
        .hover-shadow:hover {
            box-shadow: 0 .5rem 1rem rgba(0,0,0,.08)!important;
        }
        /* Style adjustments for detail layout */
        .carousel-indicators [data-bs-target] {
            background-color: #ff4b2b;
        }
    </style>
</head>

<body class="bg-light" th:data-logged-in="${isLoggedIn}">

    <!-- Include Navbar -->
    <div th:replace="~{layout/navbar :: navbar}"></div>

    <!-- Main Content -->
    <main class="py-3">
        <div class="container py-4">
            <div class="row g-4">
                <!-- Cột Trái: Thông tin món ăn & Coupon (Mặc định full-width col-lg-12) -->
                <div class="col-12 col-lg-12" id="detailLeftColumn">
                    <!-- 1. Mảnh thông tin cơ bản món ăn -->
                    <div th:replace="~{food/fragments/food-info :: foodInfo}"></div>

                    <!-- 3. Mảnh danh sách coupon -->
                    <div th:replace="~{food/fragments/coupon-list :: couponList}"></div>
                </div>
            </div>

            <!-- Offcanvas Đặt hàng ngay (Drawer bên phải) -->
            <div class="offcanvas offcanvas-end border-0 shadow-lg rounded-start-4" tabindex="-1" id="quickOrderOffcanvas" aria-labelledby="quickOrderOffcanvasLabel" style="width: 420px; z-index: 1050;" th:insert="~{food/fragments/quick-order-sidebar :: quickOrderSidebar}">
            </div>

            <!-- Các phần đề xuất bên dưới (Full-width) -->
            <div class="mt-4">
                <!-- 4. Mảnh gợi ý món dành riêng cho bạn -->
                <div th:replace="~{food/fragments/recommended-foods :: recommendedFoods}"></div>

                <!-- 5. Mảnh gợi ý mọi người cũng thích -->
                <div th:replace="~{food/fragments/people-also-liked :: peopleAlsoLiked}"></div>
            </div>
        </div>
    </main>

    <!-- Include Footer -->
    <div th:replace="~{layout/footer :: footer}"></div>

    <!-- Toast thông báo thêm vào giỏ hàng thành công -->
    <div class="toast-container position-fixed bottom-0 end-0 p-3" style="z-index: 1300;">
        <div id="cartToast" class="toast align-items-center text-white bg-success border-0 rounded-3 shadow" role="alert" aria-live="assertive" aria-atomic="true">
            <div class="d-flex">
                <div class="toast-body d-flex align-items-center gap-2">
                    <i class="bi bi-check-circle-fill"></i>
                    <span>Đã thêm món ăn vào giỏ hàng thành công!</span>
                </div>
                <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
            </div>
        </div>
    </div>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <script th:inline="javascript">
        // Lấy danh sách ảnh chi tiết từ Model truyền qua
        const detailImages = /*[[${foodImagesList}]]*/ [];
        let currentDetailImageIndex = 0;

        // Trạng thái món ăn hiện tại
        const currentFood = {
            id: /*[[${food.id}]]*/ 0,
            name: /*[[${food.name}]]*/ "",
            price: /*[[${food.price}]]*/ 0,
            discountPrice: /*[[${food.discountPrice != null ? food.discountPrice : food.price}]]*/ 0,
            serviceFee: /*[[${food.serviceFee != null ? food.serviceFee : 0}]]*/ 0
        };

        // Hàm đổi ảnh chính từ các ảnh nhỏ chi tiết (thumbnails)
        function changeMainImage(el, src) {
            const mainImg = document.getElementById('mainFoodImage');
            if (mainImg) {
                mainImg.style.opacity = '0';
                setTimeout(() => {
                    mainImg.src = src;
                    mainImg.style.opacity = '1';
                }, 200);
            }
            
            // Cập nhật viền cho ảnh nhỏ đang chọn
            const thumbs = document.querySelectorAll('.thumb-img-container');
            thumbs.forEach((t, index) => {
                t.classList.remove('border-danger');
                t.classList.add('border-light');
                if (t === el) {
                    currentDetailImageIndex = index;
                }
            });
            el.classList.remove('border-light');
            el.classList.add('border-danger');
        }

        // Đổi ảnh bằng cách truyền index
        function changeMainImageByIndex(index) {
            if (!detailImages || detailImages.length === 0) return;
            const thumbs = document.querySelectorAll('.thumb-img-container');
            if (thumbs.length > index) {
                changeMainImage(thumbs[index], detailImages[index]);
            }
        }

        // Mũi tên qua trái
        function prevDetailImage(e) {
            e.preventDefault();
            e.stopPropagation();
            if (!detailImages || detailImages.length <= 1) return;
            currentDetailImageIndex = (currentDetailImageIndex - 1 + detailImages.length) % detailImages.length;
            changeMainImageByIndex(currentDetailImageIndex);
        }

        // Mũi tên qua phải
        function nextDetailImage(e) {
            e.preventDefault();
            e.stopPropagation();
            if (!detailImages || detailImages.length <= 1) return;
            currentDetailImageIndex = (currentDetailImageIndex + 1) % detailImages.length;
            changeMainImageByIndex(currentDetailImageIndex);
        }

        // Hàm hiển thị offcanvas thanh toán nhanh
        function showCheckoutSidebar(mode = 'view_cart') {
            const offcanvasEl = document.getElementById('quickOrderOffcanvas');
            if (offcanvasEl) {
                if (typeof initDrawer === 'function') {
                    initDrawer(mode);
                }
                const bsOffcanvas = bootstrap.Offcanvas.getInstance(offcanvasEl) || new bootstrap.Offcanvas(offcanvasEl);
                bsOffcanvas.show();
            }
        }

        // Khởi tạo các sự kiện khi DOM đã load
        document.addEventListener('DOMContentLoaded', () => {
            const btnMainAddToCart = document.getElementById('btnMainAddToCart');
            const btnMainAddToNavbarCart = document.getElementById('btnMainAddToNavbarCart');

            if (btnMainAddToCart) {
                btnMainAddToCart.addEventListener('click', (e) => {
                    e.preventDefault();
                    // Chỉ hiển thị offcanvas đặt hàng với chế độ Mua Ngay
                    showCheckoutSidebar('buy_now');
                });
            }

            if (btnMainAddToNavbarCart) {
                btnMainAddToNavbarCart.addEventListener('click', (e) => {
                    e.preventDefault();
                    // Thêm sản phẩm vào giỏ hàng toàn cục
                    if (typeof addToCartGlobal === 'function') {
                        addToCartGlobal(currentFood.id, currentFood.name, currentFood.price, currentFood.discountPrice, currentFood.serviceFee);
                    }
                    
                    // Hiển thị toast thông báo thành công
                    const toastEl = document.getElementById('cartToast');
                    if (toastEl) {
                        const toastBody = toastEl.querySelector('.toast-body span');
                        if (toastBody) {
                            toastBody.innerText = `Đã thêm "${currentFood.name}" vào giỏ hàng!`;
                        }
                        const toast = new bootstrap.Toast(toastEl);
                        toast.show();
                    }
                });
            }
        });
    </script>
</body>

</html>
