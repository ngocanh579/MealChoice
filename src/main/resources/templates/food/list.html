<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý món ăn - MealChoice</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>

<body class="bg-light">

<div th:replace="~{layout/navbar :: navbar}"></div>

<div class="container py-4">

    <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">

        <div>
            <h3 class="fw-bold text-danger mb-1">
                <i class="bi bi-basket2-fill me-2"></i>
                Quản Lý Món Ăn
            </h3>

            <p class="text-muted mb-0">
                Xem danh sách và tìm kiếm món ăn theo tên.
            </p>
        </div>

        <div class="d-flex gap-2">

            <a href="/merchant/foods/create"
               class="btn btn-danger rounded-pill px-3 fw-semibold">

                <i class="bi bi-plus-circle me-1"></i>
                Thêm món ăn

            </a>

            <a href="/merchant/profile"
               class="btn btn-outline-secondary rounded-pill px-3">

                <i class="bi bi-arrow-left me-1"></i>
                Quay lại Kênh Merchant

            </a>

        </div>

    </div>


    <div class="card border-0 shadow-sm rounded-4 mb-4">

        <div class="card-body p-4">

            <form method="get"
                  action="/merchant/foods"
                  class="row g-2">

                <div class="col-md-9">

                    <div class="input-group">

                        <span class="input-group-text bg-white">
                            <i class="bi bi-search"></i>
                        </span>

                        <input type="text"
                               class="form-control"
                               name="foodName"
                               th:value="${foodName}"
                               placeholder="Nhập tên món ăn cần tìm...">

                    </div>

                </div>


                <div class="col-md-3 d-grid">

                    <button type="submit"
                            class="btn btn-danger fw-semibold">

                        <i class="bi bi-search me-1"></i>
                        Tìm kiếm

                    </button>

                </div>

            </form>


            <div class="mt-3"
                 th:if="${foodName != null and !foodName.isEmpty()}">

                <a href="/merchant/foods"
                   class="text-decoration-none">

                    <i class="bi bi-x-circle me-1"></i>
                    Xóa tìm kiếm

                </a>

            </div>

        </div>

    </div>


    <div class="card border-0 shadow-sm rounded-4">

        <div class="card-header bg-white border-0 py-3">

            <div class="d-flex justify-content-between align-items-center">

                <h5 class="fw-bold mb-0">

                    <i class="bi bi-list-ul text-danger me-2"></i>
                    Danh Sách Món Ăn

                </h5>

                <span class="badge bg-danger rounded-pill"
                      th:text="${#lists.size(foods)} + ' món'">

                    0 món

                </span>

            </div>

        </div>


        <div class="card-body">

            <div th:if="${#lists.isEmpty(foods)}"
                 class="text-center text-muted py-5">

                <i class="bi bi-inbox fs-1 d-block mb-3"></i>


                <p class="mb-0"
                   th:if="${foodName == null or foodName.isEmpty()}">

                    Chưa có món ăn nào.

                </p>


                <p class="mb-0"
                   th:unless="${foodName == null or foodName.isEmpty()}">

                    Không tìm thấy món ăn phù hợp.

                </p>

            </div>


            <div class="table-responsive"
                 th:unless="${#lists.isEmpty(foods)}">

                <table class="table table-hover align-middle mb-0">

                    <thead class="table-light">

                    <tr>

                        <th style="width:70px">
                            STT
                        </th>

                        <th>
                            Tên món
                        </th>

                        <th>
                            Giá
                        </th>

                        <th>
                            Giá giảm
                        </th>

                        <th>
                            Thời gian chuẩn bị
                        </th>

                        <th>
                            Ngày tạo
                        </th>

                    </tr>

                    </thead>


                    <tbody>

                    <tr th:each="food, stat : ${foods}">

                        <td class="fw-bold text-muted"
                            th:text="${stat.count}">

                            1

                        </td>


                        <td class="fw-semibold"
                            th:text="${food.foodName}">

                            Cơm rang

                        </td>


                        <td th:text="${#numbers.formatDecimal(food.price, 0, 'COMMA', 0, 'POINT')} + ' đ'">

                            0 đ

                        </td>


                        <td>

                            <span th:if="${food.discountPrice != null}"
                                  class="text-danger fw-semibold"
                                  th:text="${#numbers.formatDecimal(food.discountPrice, 0, 'COMMA', 0, 'POINT')} + ' đ'">

                                0 đ

                            </span>


                            <span th:if="${food.discountPrice == null}"
                                  class="text-muted">

                                Không có

                            </span>

                        </td>


                        <td>

                            <span th:text="${food.preparationTime != null ? food.preparationTime + ' phút' : 'Chưa có'}">

                                Chưa có

                            </span>

                        </td>


                        <td>

                            <span th:text="${food.createdAt != null ? #temporals.format(food.createdAt, 'dd/MM/yyyy HH:mm') : ''}">
                            </span>

                        </td>

                    </tr>

                    </tbody>

                </table>

            </div>

        </div>

    </div>

</div>


<div th:replace="~{layout/footer :: footer}"></div>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
