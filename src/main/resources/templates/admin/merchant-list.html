<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý Merchant - MealChoice</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link href="/css/style.css" rel="stylesheet">
</head>
<body class="mc-page" data-page="admin-merchant-list">
<div th:replace="~{layout/navbar :: navbar}"></div>
<main class="mc-shell mc-main">
    <section class="mc-hero">
        <h1>Quản lý Merchant</h1>
        <p>Duyệt hoặc từ chối đăng ký, xem chi tiết, khóa/mở khóa và xét đối tác thân thiết.</p>
    </section>

    <div id="pageAlert" class="mc-alert" role="alert"></div>
    <section class="mc-grid mc-grid-4" aria-label="Tổng quan merchant">
        <article class="mc-card mc-kpi"><span>Tổng đang hiển thị</span><strong id="countALL">0</strong></article>
        <article class="mc-card mc-kpi"><span>Chờ duyệt</span><strong id="countPENDING">0</strong></article>
        <article class="mc-card mc-kpi"><span>Đã duyệt</span><strong id="countAPPROVED">0</strong></article>
        <article class="mc-card mc-kpi"><span>Đang khóa</span><strong id="countBLOCKED">0</strong></article>
    </section>

    <div class="mc-section-title"><h2>Danh sách merchant</h2></div>
    <section class="mc-card">
        <form id="filterForm" class="mc-form-grid" style="margin-bottom:20px">
            <div class="mc-field">
                <label for="keyword">Tìm kiếm</label>
                <input id="keyword" placeholder="Tên quán, chủ quán, email hoặc số điện thoại">
            </div>
            <div class="mc-field">
                <label for="statusFilter">Trạng thái</label>
                <select id="statusFilter">
                    <option value="">Tất cả</option>
                    <option value="PENDING">Chờ duyệt</option>
                    <option value="APPROVED">Đã duyệt</option>
                    <option value="REJECTED">Đã từ chối</option>
                    <option value="BLOCKED">Đang khóa</option>
                </select>
            </div>
            <div class="mc-field-full mc-actions" style="margin-top:0">
                <button class="mc-btn mc-btn-primary" type="submit">Lọc danh sách</button>
                <button id="resetFilter" class="mc-btn mc-btn-outline" type="button">Đặt lại</button>
            </div>
        </form>

        <div class="mc-table-wrap">
            <table class="mc-table">
                <thead>
                <tr>
                    <th>Cửa hàng</th>
                    <th>Liên hệ</th>
                    <th>Trạng thái</th>
                    <th>Đối tác</th>
                    <th>Tài khoản</th>
                    <th>Thao tác</th>
                </tr>
                </thead>
                <tbody id="merchantRows">
                <tr><td colspan="6" class="mc-empty">Đang tải danh sách...</td></tr>
                </tbody>
            </table>
        </div>
    </section>
</main>
<div th:replace="~{layout/footer :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/main.js"></script>
<script src="/js/admin-merchants.js"></script>
</body>
</html>
