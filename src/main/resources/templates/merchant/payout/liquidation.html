<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <title>Thanh lý hợp đồng</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

</head>


<body class="bg-light">

<div th:replace="~{layout/navbar :: navbar}"></div>


<div class="container py-4">

    <h3 class="mb-4 text-danger">

        <i class="bi bi-file-earmark-x me-2"></i>

        Thanh lý hợp đồng

    </h3>


    <div th:if="${message}"
         class="alert alert-success"
         th:text="${message}">
    </div>


    <div th:if="${error}"
         class="alert alert-danger"
         th:text="${error}">
    </div>


    <div class="card shadow-sm border-0">

        <div class="card-body p-4">


            <div class="alert alert-warning">

                <strong>
                    Lưu ý:
                </strong>

                Khi yêu cầu thanh lý được Admin
                xác nhận hoàn tất, toàn bộ số dư
                của Merchant sẽ được thanh toán và
                tài khoản Merchant sẽ chuyển sang

                <strong>BLOCKED</strong>.

            </div>


            <div class="row g-4 mt-2">


                <div class="col-md-6">

                    <small class="text-muted">
                        Tổng doanh thu
                    </small>

                    <h4 th:text="${#numbers.formatDecimal(
                            totalRevenue,
                            0,
                            'COMMA',
                            0,
                            'POINT'
                        ) + ' VNĐ'}">

                        0 VNĐ

                    </h4>

                </div>


                <div class="col-md-6">

                    <small class="text-muted">
                        Số tiền sẽ được thanh toán
                    </small>

                    <h4 class="text-danger"
                        th:text="${#numbers.formatDecimal(
                            availableBalance,
                            0,
                            'COMMA',
                            0,
                            'POINT'
                        ) + ' VNĐ'}">

                        0 VNĐ

                    </h4>

                </div>


                <div class="col-md-6">

                    <small class="text-muted">
                        Ngân hàng
                    </small>

                    <div class="fw-semibold"
                         th:text="${merchant.bankName}">
                        -
                    </div>

                </div>


                <div class="col-md-6">

                    <small class="text-muted">
                        Số tài khoản
                    </small>

                    <div class="fw-semibold"
                         th:text="${merchant.bankAccountNumber}">
                        -
                    </div>

                </div>

            </div>


            <hr class="my-4">


            <form th:action="@{/merchant/payout/liquidation}"
                  method="post">

                <div class="form-check mb-4">

                    <input class="form-check-input"
                           type="checkbox"
                           id="confirmLiquidation"
                           required>

                    <label class="form-check-label"
                           for="confirmLiquidation">

                        Tôi xác nhận muốn thanh lý hợp đồng
                        và rút toàn bộ số dư còn lại.

                    </label>

                </div>


                <button type="submit"
                        class="btn btn-danger"
                        onclick="return confirm(
                            'Bạn chắc chắn muốn gửi yêu cầu thanh lý hợp đồng?'
                        )">

                    <i class="bi bi-file-earmark-x me-1"></i>

                    Gửi yêu cầu thanh lý

                </button>

            </form>

        </div>

    </div>

</div>

</body>
</html>
