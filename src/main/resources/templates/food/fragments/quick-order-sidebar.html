<!-- Fragment Sidebar Đặt Hàng Nhanh dạng Offcanvas Drawer -->
<div th:fragment="quickOrderSidebar" class="h-100 d-flex flex-column" xmlns:th="http://www.thymeleaf.org">
    <!-- Offcanvas Header -->
    <div class="offcanvas-header border-bottom border-light-subtle py-3">
        <h5 class="offcanvas-title fw-bold text-dark d-flex align-items-center" id="quickOrderOffcanvasLabel">
            <i class="bi bi-bag-check-fill text-danger me-2 fs-4"></i>Đặt hàng ngay
        </h5>
        <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Close"></button>
    </div>

    <!-- Offcanvas Body -->
    <div class="offcanvas-body d-flex flex-column p-4 justify-content-between h-100">
        <div>
            <!-- Badge số lượng ở đầu body -->
            <div class="d-flex justify-content-between align-items-center mb-3">
                <span class="text-secondary fw-semibold fs-7">Đơn hàng của bạn</span>
                <span class="badge bg-danger rounded-pill px-2.5 py-1 fs-8 fw-bold" id="cartBadgeCount">0 phần</span>
            </div>

            <!-- Danh sách món ăn đã thêm -->
            <div class="cart-items-container mb-4 overflow-y-auto" style="max-height: 380px;" id="cartItemsList">
                <!-- Items will be generated dynamically by JS -->
            </div>
        </div>

        <!-- Khối giá tiền & Nút thanh toán -->
        <div class="mt-auto border-top border-light-subtle pt-3">
            <div class="fs-7 mb-3">
                <div class="d-flex justify-content-between mb-2">
                    <span class="text-muted">Tổng đơn (giá gốc)</span>
                    <span class="fw-semibold text-dark" id="cartTotalOriginal">0 đ</span>
                </div>

                <div class="d-flex justify-content-between mb-2">
                    <span class="text-muted">Giảm giá</span>
                    <span class="fw-semibold text-success" id="cartDiscount">-0 đ</span>
                </div>

                <div class="d-flex justify-content-between mb-2" id="serviceFeeRow">
                    <span class="text-muted">Phí dịch vụ</span>
                    <span class="fw-semibold text-dark" id="cartServiceFee">0 đ</span>
                </div>

                <div class="d-flex justify-content-between mb-3 pt-2 border-top border-dashed">
                    <span class="text-dark fw-bold">Thanh toán</span>
                    <span class="text-danger fw-extrabold fs-5" id="cartTotalPayment">0 đ</span>
                </div>

                <!-- Tiết kiệm -->
                <div class="alert alert-success bg-success bg-opacity-10 border-0 rounded-3 p-2 mb-0 align-items-center gap-1.5 fs-8 text-success d-none"
                     id="savingAlert">
                    <i class="bi bi-gift-fill"></i>
                    <span>Bạn đã tiết kiệm được <strong id="cartSavings">0 đ</strong></span>
                </div>
            </div>

            <!-- Nút Thanh toán -->
            <button class="btn btn-danger btn-lg w-100 rounded-pill fw-bold py-3 shadow-sm transition-hover"
                    style="background: linear-gradient(135deg, #ff416c, #ff4b2b); border: none;"
                    id="btnCheckout">
                Thanh Toán
            </button>
        </div>
    </div>

    <!-- JavaScript Xử Lý Giỏ Hàng & Tính Toán -->
    <script th:inline="javascript">
        const sidebarFood = {
            id: /*[[${food.id}]]*/ 0,
            name: /*[[${food.foodName}]]*/ "",
            price: /*[[${food.price}]]*/ 0,
            discountPrice: /*[[${food.discountPrice != null ? food.discountPrice : food.price}]]*/ 0,
            serviceFee: /*[[${food.serviceFee != null ? food.serviceFee : 0}]]*/ 0,
            merchantId: /*[[${food.merchant != null ? food.merchant.id : ''}]]*/ "",
            merchantName: /*[[${food.merchant != null ? food.merchant.merchantRestaurantName : ''}]]*/ "",
            image: /*[[${foodImagesList != null && !foodImagesList.isEmpty() ? foodImagesList[0] : ''}]]*/ ""
        };

        let drawerCart = [];
        let drawerMode = 'view_cart';

        function formatCurrency(val) {
            return new Intl.NumberFormat('vi-VN').format(Math.round(val)) + ' đ';
        }

        function initDrawer(mode) {
            drawerMode = mode;

            const globalCart = (typeof getGlobalCart === 'function')
                ? getGlobalCart()
                : [];

            if (mode === 'buy_now') {
                if (
                    globalCart.length > 0 &&
                    sidebarFood.merchantId &&
                    globalCart[0].merchantId &&
                    globalCart[0].merchantId !== sidebarFood.merchantId
                ) {
                    drawerCart = [];
                } else {
                    drawerCart = [...globalCart];
                }

                const exists = drawerCart.find(item => item.id === sidebarFood.id);

                if (!exists) {
                    drawerCart.push({
                        id: sidebarFood.id,
                        name: sidebarFood.name,
                        price: sidebarFood.price,
                        discountPrice: sidebarFood.discountPrice,
                        serviceFee: sidebarFood.serviceFee,
                        merchantId: sidebarFood.merchantId,
                        merchantName: sidebarFood.merchantName,
                        image: sidebarFood.image,
                        quantity: 1,
                        isTemporary: true
                    });
                }
            } else {
                drawerCart = [...globalCart];
            }

            updateCartUI();
        }

        function changeQuantity(id, delta) {
            const item = drawerCart.find(i => i.id === id);

            if (!item) return;

            item.quantity += delta;

            if (item.quantity <= 0) {
                drawerCart = drawerCart.filter(i => i.id !== id);
            }

            if (!item.isTemporary) {
                if (typeof changeQuantityGlobal === 'function') {
                    changeQuantityGlobal(id, delta);
                }
            } else {
                updateCartUI();
            }
        }

        function updateCartUI() {
            const cartItemsList = document.getElementById('cartItemsList');
            const cartBadgeCount = document.getElementById('cartBadgeCount');
            const cartTotalOriginal = document.getElementById('cartTotalOriginal');
            const cartDiscount = document.getElementById('cartDiscount');
            const cartServiceFee = document.getElementById('cartServiceFee');
            const cartTotalPayment = document.getElementById('cartTotalPayment');
            const cartSavings = document.getElementById('cartSavings');
            const savingAlert = document.getElementById('savingAlert');
            const btnCheckout = document.getElementById('btnCheckout');

            if (!cartItemsList) return;

            cartItemsList.innerHTML = '';

            let totalItems = 0;
            let sumOriginal = 0;
            let sumDiscount = 0;
            let sumServiceFee = 0;

            if (drawerCart.length === 0) {
                cartItemsList.innerHTML = `
                    <div class="text-center py-5 text-muted">
                        <i class="bi bi-bag-x fs-1 text-secondary opacity-50 mb-2 d-block"></i>
                        <p class="mb-0 fs-8">Chưa có món ăn nào trong đơn hàng</p>
                    </div>
                `;

                if (btnCheckout) {
                    btnCheckout.disabled = true;
                    btnCheckout.classList.add('opacity-50');
                }
            } else {
                if (btnCheckout) {
                    btnCheckout.disabled = false;
                    btnCheckout.classList.remove('opacity-50');
                }

                drawerCart.forEach(item => {
                    totalItems += item.quantity;
                    sumOriginal += item.price * item.quantity;
                    sumDiscount += (item.price - item.discountPrice) * item.quantity;
                    sumServiceFee = Math.max(sumServiceFee, item.serviceFee);

                    const li = document.createElement('div');

                    li.className = 'd-flex align-items-center justify-content-between mb-3 py-2 border-bottom border-light-subtle';

                    li.innerHTML = `
                        <div class="flex-grow-1 pe-2 overflow-hidden">
                            <h6 class="fw-semibold text-dark fs-7 mb-0 text-truncate"
                                title="${item.name}">
                                ${item.name}
                            </h6>
                            <span class="text-danger fw-bold fs-8">
                                ${formatCurrency(item.discountPrice)}
                            </span>
                        </div>

                        <div class="d-flex align-items-center gap-2">
                            <button class="btn btn-sm btn-outline-secondary rounded-circle d-flex align-items-center justify-content-center border-1"
                                    style="width: 24px; height: 24px; font-weight: bold; line-height: 1; padding: 0;"
                                    onclick="changeQuantity(${item.id}, -1)">
                                -
                            </button>

                            <span class="fw-bold fs-7 text-dark"
                                  style="min-width: 16px; text-align: center;">
                                ${item.quantity}
                            </span>

                            <button class="btn btn-sm btn-outline-danger rounded-circle d-flex align-items-center justify-content-center border-1"
                                    style="width: 24px; height: 24px; font-weight: bold; line-height: 1; padding: 0;"
                                    onclick="changeQuantity(${item.id}, 1)">
                                +
                            </button>
                        </div>
                    `;

                    cartItemsList.appendChild(li);
                });
            }

            const totalPayment = sumOriginal - sumDiscount + sumServiceFee;

            if (cartBadgeCount) {
                cartBadgeCount.innerText = `${totalItems} phần`;
            }

            if (cartTotalOriginal) {
                cartTotalOriginal.innerText = formatCurrency(sumOriginal);
            }

            if (cartDiscount) {
                cartDiscount.innerText = `- ${formatCurrency(sumDiscount)}`;
            }

            if (cartServiceFee) {
                cartServiceFee.innerText = formatCurrency(sumServiceFee);
            }

            if (cartTotalPayment) {
                cartTotalPayment.innerText = formatCurrency(
                    drawerCart.length > 0 ? totalPayment : 0
                );
            }

            if (savingAlert) {
                if (sumDiscount > 0 && drawerCart.length > 0) {
                    if (cartSavings) {
                        cartSavings.innerText = formatCurrency(sumDiscount);
                    }

                    savingAlert.classList.remove('d-none');
                    savingAlert.classList.add('d-flex');
                } else {
                    savingAlert.classList.remove('d-flex');
                    savingAlert.classList.add('d-none');
                }
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            initDrawer('view_cart');

            window.addEventListener('cartUpdated', () => {
                if (drawerMode === 'view_cart') {
                    initDrawer('view_cart');
                }
            });

            const btnCheckout = document.getElementById('btnCheckout');

            if (btnCheckout) {
                btnCheckout.addEventListener('click', () => {
                    if (drawerCart.length === 0) return;

                    if (typeof saveGlobalCart === 'function') {
                        saveGlobalCart(drawerCart);
                    }

                    const offcanvasEl = document.getElementById('quickOrderOffcanvas');

                    if (offcanvasEl) {
                        const bsOffcanvas =
                            bootstrap.Offcanvas.getInstance(offcanvasEl) ||
                            new bootstrap.Offcanvas(offcanvasEl);

                        bsOffcanvas.hide();
                    }

                    window.location.href = '/checkout';
                });
            }
        });
    </script>
</div>
