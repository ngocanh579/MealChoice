<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rút tiền - Merchant</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/merchant.css}">
</head>

<body class="merchant-page">

<div th:replace="~{merchant/layout :: shell('Rút tiền', 'payout', ~{::content})}">

    <section th:fragment="content" class="d-flex flex-column gap-4">

        <div class="merchant-toolbar">
            <h4 class="fw-bold mb-1">
                <i class="bi bi-wallet2 me-2 text-danger"></i>
                Rút tiền
            </h4>
            <p class="text-muted mb-0">
                Quản lý số dư và gửi yêu cầu rút tiền về tài khoản ngân hàng.
            </p>
        </div>

        <div th:if="${message}" class="alert alert-success mb-0">
            <i class="bi bi-check-circle-fill me-2"></i>
            <span th:text="${message}"></span>
        </div>

        <div th:if="${error}" class="alert alert-danger mb-0">
            <i class="bi bi-exclamation-triangle-fill me-2"></i>
            <span th:text="${error}"></span>
        </div>

        <div class="row g-4">

            <div class="col-lg-7">

                <div class="merchant-panel h-100">

                    <h5 class="fw-bold mb-4">
                        Thông tin tài chính
                    </h5>

                    <div class="mb-4">
                        <small class="text-muted d-block mb-1">
                            Tổng doanh thu
                        </small>

                        <h4 class="mb-0"
                            th:text="${#numbers.formatDecimal(
                    totalRevenue,
                    0,
                    'COMMA',
                    0,
                    'POINT'
                ) + ' VNĐ'}">
                            0 VNĐ
                        </h4>
                    </div>

                    <div class="mb-4">
                        <small class="text-muted d-block mb-1">
                            Số dư có thể rút
                        </small>

                        <h4 class="text-success mb-0"
                            th:text="${#numbers.formatDecimal(
                    availableBalance,
                    0,
                    'COMMA',
                    0,
                    'POINT'
                ) + ' VNĐ'}">
                            0 VNĐ
                        </h4>
                    </div>

                    <div class="alert alert-info mb-0">
                        <i class="bi bi-info-circle me-1"></i>
                        Merchant chỉ được gửi yêu cầu rút tiền khi tổng doanh thu
                        <strong>lớn hơn 1000 VNĐ</strong>.
                    </div>

                </div>

            </div>

            <div class="col-lg-5">

                <div class="merchant-panel h-100">

                    <h5 class="fw-bold mb-4">
                        Yêu cầu rút tiền
                    </h5>

                    <div class="mb-3">
                        <label class="form-label text-muted">
                            Ngân hàng
                        </label>

                        <div class="fw-semibold"
                             th:text="${merchant.bankName}">
                            -
                        </div>
                    </div>

                    <div class="mb-4">
                        <label class="form-label text-muted">
                            Số tài khoản
                        </label>

                        <div class="fw-semibold"
                             th:text="${merchant.bankAccountNumber}">
                            -
                        </div>
                    </div>

                    <form th:action="@{/merchant/payout/withdraw}"
                          method="post">

                        <div class="mb-3">
                            <label class="form-label fw-semibold">
                                Số tiền muốn rút
                            </label>

                            <div class="input-group">
                                <input type="number"
                                       class="form-control"
                                       name="amount"
                                       min="1"
                                       step="1"
                                       required>

                                <span class="input-group-text">
                  VNĐ
                </span>
                            </div>
                        </div>

                        <button type="submit"
                                class="btn btn-danger w-100">
                            <i class="bi bi-send me-1"></i>
                            Gửi yêu cầu rút tiền
                        </button>

                    </form>

                </div>

            </div>

        </div>

    </section>
</div>

</body>
</html>
