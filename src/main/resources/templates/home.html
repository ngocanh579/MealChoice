<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trang Chủ - Trưa Nay Ăn Gì?</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
            font-family: system-ui, -apple-system, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        main {
            flex: 1;
        }
    </style>
</head>

<body>

    <!-- Include Navbar -->
    <div th:replace="~{layout/navbar :: navbar}"></div>

    <!-- Main Content Area -->
    <main class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-10 text-center py-5">
                <h1 class="fw-bold text-danger mb-3">
                    <i class="bi bi-geo-alt-fill me-2"></i>Chào mừng bạn đến với Trưa Nay Ăn Gì?
                </h1>
                <p class="lead text-muted">
                    Khám phá và chọn lựa những món ăn ngon miệng nhất mỗi ngày.
                </p>
            </div>
        </div>
    </main>

    <!-- Include Footer -->
    <div th:replace="~{layout/footer :: footer}"></div>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
