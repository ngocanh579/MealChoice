<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<footer th:fragment="footer"
        class="bg-dark text-white mt-5 py-4">

    <div class="container">
        <div class="row">

            <div class="col-md-4 mb-3">
                <h5 th:text="${appInfo.name}">
                    Trưa Nay Ăn Gì
                </h5>

                <p class="mb-0">
                    Nền tảng giúp người dùng tìm kiếm và đặt món ăn
                    nhanh chóng, thuận tiện.
                </p>
            </div>

            <div class="col-md-4 mb-3">
                <h5>Thông tin liên hệ</h5>

                <p class="mb-1">
                    Email:
                    <a class="text-white"
                       th:href="'mailto:' + ${appInfo.email}"
                       th:text="${appInfo.email}">
                        support@truanayangi.vn
                    </a>
                </p>

                <p class="mb-1">
                    Điện thoại:
                    <span th:text="${appInfo.phone}">
                        6666 8888
                    </span>
                </p>

                <p class="mb-0">
                    Địa chỉ:
                    <span th:text="${appInfo.address}">
                        Hà Nội, Việt Nam
                    </span>
                </p>
            </div>

            <div class="col-md-4 mb-3">
                <h5>Quản trị hệ thống</h5>

                <a th:href="@{/admin/dashboard}"
                   class="text-white text-decoration-none">
                    Trang quản trị
                </a>
            </div>

        </div>

        <hr>

        <div class="text-center">
            <span>&copy;</span>

            <span th:text="${currentYear}">
                2026
            </span>

            <span th:text="${appInfo.company}">
                Nhóm phát triển Trưa Nay Ăn Gì
            </span>

            <span>. All rights reserved.</span>
        </div>
    </div>

</footer>
</body>
</html>
