<!-- Fragment Sidebar Đặt Hàng Nhanh dạng Offcanvas Drawer -->
<div th:fragment="quickOrderSidebar" class="h-100 d-flex flex-column" xmlns:th="http://www.thymeleaf.org">
    <!-- Offcanvas Header -->
    <div class="offcanvas-header border-bottom border-light-subtle py-3">
        <h5 class="offcanvas-title fw-bold text-dark d-flex align-items-center" id="quickOrderOffcanvasLabel">
            <i class="bi bi-bag-check-fill text-danger me-2 fs-4"></i>Giỏ hàng của bạn
        </h5>
        <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Close"></button>
    </div>

    <!-- Offcanvas Body -->
    <div class="offcanvas-body d-flex flex-column p-4 justify-content-between h-100">
        <div>
            <!-- Badge số lượng ở đầu body -->
            <div class="d-flex justify-content-between align-items-center mb-3">
                <span class="text-secondary fw-semibold fs-7">Đơn hàng của bạn</span>
                <span class="badge bg-danger rounded-pill px-2.5 py-1 fs-8 fw-bold" id="cartBadgeCount">0 phần</span>
            </div>

            <!-- Danh sách món ăn đã thêm -->
            <div class="cart-items-container mb-4 overflow-y-auto" style="max-height: 380px;" id="cartItemsList">
                <!-- Render động bằng JS bên dưới, dữ liệu lấy từ API giỏ hàng thật -->
            </div>
        </div>

        <!-- Khối giá tiền & Nút thanh toán (luôn nằm ở đáy body) -->
        <div class="mt-auto border-top border-light-subtle pt-3">
            <div class="fs-7 mb-3">
                <div class="d-flex justify-content-between mb-2">
                    <span class="text-muted">Tổng tiền món</span>
                    <span class="fw-semibold text-dark" id="cartTotalPayment">0 đ</span>
                </div>
                <p class="text-muted fs-8 mb-0">Phí ship &amp; phí dịch vụ sẽ được tính ở bước thanh toán.</p>
            </div>

            <!-- Nút Thanh toán -->
            <button class="btn btn-danger btn-lg w-100 rounded-pill fw-bold py-3 shadow-sm transition-hover"
                    style="background: linear-gradient(135deg, #ff416c, #ff4b2b); border: none;"
                    id="btnCheckout">
                Đến trang thanh toán
            </button>
        </div>
    </div>

    <!-- JavaScript Xử Lý Giỏ Hàng (Sidebar) — đọc/ghi trực tiếp qua API giỏ hàng thật -->
    <script>
        // Tải & render giỏ hàng thật vào sidebar
        async function initDrawer() {
            const cartItemsList = document.getElementById('cartItemsList');
            const cartBadgeCount = document.getElementById('cartBadgeCount');
            const cartTotalPayment = document.getElementById('cartTotalPayment');
            const btnCheckout = document.getElementById('btnCheckout');

            if (!cartItemsList) return;

            if (typeof isUserLoggedIn === 'function' && !isUserLoggedIn()) {
                cartItemsList.innerHTML = `
                    <div class="text-center py-5 text-muted">
                        <i class="bi bi-person-lock fs-1 text-secondary opacity-50 mb-2 d-block"></i>
                        <p class="mb-0 fs-8">Vui lòng đăng nhập để xem giỏ hàng</p>
                    </div>`;
                if (btnCheckout) { btnCheckout.disabled = true; btnCheckout.classList.add('opacity-50'); }
                return;
            }

            try {
                const cart = await apiGetCart();
                renderDrawerCart(cart);
            } catch (e) {
                cartItemsList.innerHTML = `<div class="text-center py-5 text-danger fs-8">${escapeHtml(e.message || 'Không tải được giỏ hàng')}</div>`;
            }
        }

        function renderDrawerCart(cart) {
            const cartItemsList = document.getElementById('cartItemsList');
            const cartBadgeCount = document.getElementById('cartBadgeCount');
            const cartTotalPayment = document.getElementById('cartTotalPayment');
            const btnCheckout = document.getElementById('btnCheckout');

            if (!cartItemsList) return;

            const allItems = (cart.merchantGroups || [])
                .flatMap(g => (g.items || []).map(it => ({ ...it, merchantName: g.merchantName })));

            const totalQty = allItems.reduce((s, it) => s + it.quantity, 0);

            if (allItems.length === 0) {
                cartItemsList.innerHTML = `
                    <div class="text-center py-5 text-muted">
                        <i class="bi bi-bag-x fs-1 text-secondary opacity-50 mb-2 d-block"></i>
                        <p class="mb-0 fs-8">Chưa có món ăn nào trong giỏ hàng</p>
                    </div>
                `;
                if (btnCheckout) { btnCheckout.disabled = true; btnCheckout.classList.add('opacity-50'); }
            } else {
                if (btnCheckout) { btnCheckout.disabled = false; btnCheckout.classList.remove('opacity-50'); }

                cartItemsList.innerHTML = allItems.map(item => `
                    <div class="d-flex align-items-center justify-content-between mb-3 py-2 border-bottom border-light-subtle">
                        <div class="flex-grow-1 pe-2 overflow-hidden">
                            <h6 class="fw-semibold text-dark fs-7 mb-0 text-truncate" title="${escapeHtml(item.foodName)}">${escapeHtml(item.foodName)}</h6>
                            <span class="text-muted fs-8">${escapeHtml(item.merchantName)}</span><br>
                            <span class="text-danger fw-bold fs-8">${formatVnd(item.unitPrice)}</span>
                            ${!item.available ? `<span class="badge bg-warning text-dark ms-1">${escapeHtml(item.unavailableReason || 'Không khả dụng')}</span>` : ''}
                        </div>
                        <div class="d-flex align-items-center gap-2">
                            <button class="btn btn-sm btn-outline-secondary rounded-circle d-flex align-items-center justify-content-center border-1"
                                    style="width: 24px; height: 24px; font-weight: bold; line-height: 1; padding: 0;"
                                    onclick="drawerChangeQuantity(${item.cartItemId}, ${item.quantity - 1})">
                                -
                            </button>
                            <span class="fw-bold fs-7 text-dark" style="min-width: 16px; text-align: center;">${item.quantity}</span>
                            <button class="btn btn-sm btn-outline-danger rounded-circle d-flex align-items-center justify-content-center border-1"
                                    style="width: 24px; height: 24px; font-weight: bold; line-height: 1; padding: 0;"
                                    onclick="drawerChangeQuantity(${item.cartItemId}, ${item.quantity + 1})">
                                +
                            </button>
                        </div>
                    </div>
                `).join('');
            }

            if (cartBadgeCount) cartBadgeCount.innerText = `${totalQty} phần`;
            if (cartTotalPayment) cartTotalPayment.innerText = formatVnd(cart.totalAmount);
        }

        // Tăng/giảm số lượng trực tiếp trên sidebar (gọi API thật)
        async function drawerChangeQuantity(cartItemId, newQuantity) {
            try {
                let cart;
                if (newQuantity <= 0) {
                    cart = await apiRemoveCartItem(cartItemId);
                } else {
                    cart = await apiUpdateCartItem(cartItemId, newQuantity, null);
                }
                renderDrawerCart(cart);
                if (typeof renderNavbarCart === 'function') renderNavbarCart(cart);
                window.dispatchEvent(new CustomEvent('cartUpdated', { detail: cart }));
            } catch (e) {
                alert(e.message || 'Có lỗi xảy ra, vui lòng thử lại!');
            }
        }

        // Khởi tạo khi DOM đã load + đồng bộ khi giỏ hàng thay đổi từ nơi khác
        document.addEventListener('DOMContentLoaded', () => {
            initDrawer();

            window.addEventListener('cartUpdated', (e) => {
                if (e.detail) {
                    renderDrawerCart(e.detail);
                } else {
                    initDrawer();
                }
            });

            const btnCheckout = document.getElementById('btnCheckout');
            if (btnCheckout) {
                btnCheckout.addEventListener('click', () => {
                    if (btnCheckout.disabled) return;
                    window.location.href = '/checkout';
                });
            }
        });
    </script>
</div>
