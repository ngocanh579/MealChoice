<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng ký Merchant - MealChoice</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link href="/css/style.css" rel="stylesheet">
</head>
<body class="mc-page" data-page="merchant-register">
<div th:replace="~{layout/navbar :: navbar}"></div>
<main class="mc-shell mc-main" style="max-width:900px">
    <section class="mc-hero">
        <h1>Đăng ký trở thành Merchant</h1>
        <p>Điền thông tin thật của chủ cửa hàng. Sau khi gửi, hồ sơ sẽ ở trạng thái chờ Admin xét duyệt.</p>
    </section>

    <div id="pageAlert" class="mc-alert" role="alert"></div>
    <section class="mc-card">
        <form id="merchantRegisterForm" class="mc-form-grid">
            <div class="mc-field">
                <label for="ownerName">Tên chủ cửa hàng</label>
                <input id="ownerName" name="ownerName" required>
            </div>
            <div class="mc-field">
                <label for="restaurantName">Tên nhà hàng</label>
                <input id="restaurantName" name="restaurantName" required>
            </div>
            <div class="mc-field">
                <label for="phone">Số điện thoại</label>
                <input id="phone" name="phone" inputmode="numeric" pattern="[0-9]{10}" required>
            </div>
            <div class="mc-field">
                <label for="email">Email</label>
                <input id="email" name="email" type="email" required>
            </div>
            <div class="mc-field mc-field-full">
                <label for="address">Địa chỉ cửa hàng</label>
                <input id="address" name="address" required>
            </div>
            <div class="mc-field">
                <label for="password">Mật khẩu</label>
                <input id="password" name="password" type="password" minlength="6" required>
            </div>
            <div class="mc-field">
                <label for="confirmPassword">Nhập lại mật khẩu</label>
                <input id="confirmPassword" name="confirmPassword" type="password" minlength="6" required>
            </div>
            <div class="mc-field-full mc-actions">
                <button class="mc-btn mc-btn-primary" type="submit">Gửi hồ sơ đăng ký</button>
                <a class="mc-btn mc-btn-outline" href="/login">Quay lại đăng nhập</a>
            </div>
        </form>
    </section>
</main>
<div th:replace="~{layout/footer :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/main.js"></script>
<script src="/js/merchant.js"></script>
</body>
</html>
