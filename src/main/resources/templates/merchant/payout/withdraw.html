<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Rút tiền</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>

<body class="bg-light">

<div th:replace="~{layout/navbar :: navbar}"></div>

<div class="container py-4">

    <h3 class="mb-4">
        <i class="bi bi-wallet2 me-2"></i>
        Rút tiền
    </h3>


    <!-- MESSAGE -->

    <div th:if="${message}"
         class="alert alert-success"
         th:text="${message}">
    </div>

    <div th:if="${error}"
         class="alert alert-danger"
         th:text="${error}">
    </div>


    <div class="row g-4">

        <!-- THÔNG TIN TÀI CHÍNH -->

        <div class="col-lg-7">

            <div class="card shadow-sm border-0">

                <div class="card-body">

                    <h5 class="mb-4">
                        Thông tin tài chính
                    </h5>


                    <div class="mb-3">

                        <small class="text-muted">
                            Tổng doanh thu
                        </small>

                        <h4 th:text="${#numbers.formatDecimal(
                                totalRevenue,
                                0,
                                'COMMA',
                                0,
                                'POINT'
                            ) + ' VNĐ'}">
                            0 VNĐ
                        </h4>

                    </div>


                    <div class="mb-3">

                        <small class="text-muted">
                            Số dư có thể rút
                        </small>

                        <h4 class="text-success"
                            th:text="${#numbers.formatDecimal(
                                availableBalance,
                                0,
                                'COMMA',
                                0,
                                'POINT'
                            ) + ' VNĐ'}">
                            0 VNĐ
                        </h4>

                    </div>


                    <div class="alert alert-info">

                        Merchant chỉ được gửi yêu cầu
                        rút tiền khi tổng doanh thu

                        <strong>
                            lớn hơn 1000 VNĐ
                        </strong>.

                    </div>

                </div>

            </div>

        </div>


        <!-- FORM -->

        <div class="col-lg-5">

            <div class="card shadow-sm border-0">

                <div class="card-body">

                    <h5 class="mb-4">
                        Yêu cầu rút tiền
                    </h5>


                    <div class="mb-3">

                        <label class="text-muted">
                            Ngân hàng
                        </label>

                        <div class="fw-semibold"
                             th:text="${merchant.bankName}">
                            -
                        </div>

                    </div>


                    <div class="mb-4">

                        <label class="text-muted">
                            Số tài khoản
                        </label>

                        <div class="fw-semibold"
                             th:text="${merchant.bankAccountNumber}">
                            -
                        </div>

                    </div>


                    <form th:action="@{/merchant/payout/withdraw}"
                          method="post">

                        <div class="mb-3">

                            <label class="form-label">
                                Số tiền muốn rút
                            </label>

                            <div class="input-group">

                                <input type="number"
                                       class="form-control"
                                       name="amount"
                                       min="1"
                                       step="1"
                                       required>

                                <span class="input-group-text">
                                    VNĐ
                                </span>

                            </div>

                        </div>


                        <button type="submit"
                                class="btn btn-primary w-100">

                            <i class="bi bi-send me-1"></i>

                            Gửi yêu cầu rút tiền

                        </button>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

</body>
</html>
