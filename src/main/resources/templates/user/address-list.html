<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Địa chỉ giao hàng</title>

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>

<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="container mt-4">

    <div class="d-flex justify-content-between align-items-center">
        <h1>Địa chỉ giao hàng</h1>

        <a th:href="@{/user/addresses/create}"
           class="btn btn-primary">
            Thêm địa chỉ
        </a>
    </div>

    <div th:if="${successMessage}"
         class="alert alert-success mt-3"
         th:text="${successMessage}">
    </div>

    <div th:if="${errorMessage}"
         class="alert alert-danger mt-3"
         th:text="${errorMessage}">
    </div>

    <div th:if="${#lists.isEmpty(addresses)}"
         class="alert alert-info mt-3">
        Bạn chưa có địa chỉ giao hàng.
    </div>

    <div class="row mt-3">

        <div class="col-md-6 mb-3"
             th:each="address : ${addresses}">

            <div class="card h-100">

                <div class="card-body">

                    <div class="d-flex justify-content-between">

                        <h5 th:text="${address.recipientName}">
                            Nguyễn Văn A
                        </h5>

                        <span th:if="${address.defaultAddress}"
                              class="badge bg-success">
                            Mặc định
                        </span>

                    </div>

                    <p class="mb-1">
                        Số điện thoại:
                        <span th:text="${address.phoneNumber}">
                            0123456789
                        </span>
                    </p>

                    <p class="mb-3"
                       th:text="${address.fullAddress}">
                        Địa chỉ chi tiết
                    </p>

                    <div class="d-flex gap-2">

                        <a th:href="@{/user/addresses/{id}/edit(
                                id=${address.id}
                            )}"
                           class="btn btn-outline-primary">
                            Chỉnh sửa
                        </a>

                        <form th:action="@{/user/addresses/{id}/delete(
                                id=${address.id}
                            )}"
                              method="post"
                              onsubmit="return confirm(
                                  'Bạn có chắc chắn muốn xóa địa chỉ này?'
                              );">

                            <button type="submit"
                                    class="btn btn-outline-danger">
                                Xóa
                            </button>

                        </form>

                    </div>

                </div>
            </div>

        </div>

    </div>

</main>

<div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
