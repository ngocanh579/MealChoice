<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chỉnh sửa món ăn - Merchant</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/merchant.css}">
</head>
<body class="merchant-page">
<div th:replace="~{merchant/layout :: shell('Chỉnh sửa món ăn', 'foods', ~{::content})}">
    <section th:fragment="content" class="d-flex flex-column gap-4">

        <!-- HEADER TỐI GIẢN -->
        <div class="d-flex align-items-center justify-content-between mb-1">
            <div>
                <h2 class="fw-bold text-dark mb-1">Chỉnh sửa món ăn</h2>
                <p class="text-muted mb-0 font-size-14" th:text="'Đang cập nhật thông tin cho món: ' + ${food.foodName}">Cập nhật thông tin món ăn hiện có.</p>
            </div>
            <div>
                <a th:href="@{/merchant/foods/{id}(id=${food.id})}" class="btn btn-outline-secondary rounded-pill px-4 py-2 fw-semibold d-inline-flex align-items-center gap-2">
                    <i class="bi bi-arrow-left"></i>
                    <span>Hủy</span>
                </a>
            </div>
        </div>

        <form id="foodEditForm" th:data-food-id="${food.id}" enctype="multipart/form-data">
            <div class="row g-4">

                <!-- CỘT TRÁI: THÔNG TIN CƠ BẢN & MÔ TẢ -->
                <div class="col-lg-7 d-flex flex-column gap-4">

                    <!-- Card 1: Thông tin chung -->
                    <div class="merchant-page-card p-4">
                        <h5 class="fw-bold text-dark mb-4 pb-2 border-bottom">
                            <i class="bi bi-info-circle text-danger me-2"></i>Thông tin cơ bản
                        </h5>

                        <div class="mb-3">
                            <label for="foodName" class="form-label fw-semibold">Tên món ăn <span class="text-danger">*</span></label>
                            <input type="text" class="form-control form-control-lg bg-light border-0" id="foodName" name="foodName" th:value="${food.foodName}" placeholder="Nhập tên món ăn..." required>
                        </div>

                        <div class="mb-3">
                            <label for="merchantAddressId" class="form-label fw-semibold">Địa chỉ cửa hàng <span class="text-danger">*</span></label>
                            <select class="form-select form-select-lg bg-light border-0" id="merchantAddressId" name="merchantAddressId" required>
                                <option value="">-- Chọn địa chỉ --</option>
                                <option th:each="address : ${addresses}"
                                        th:value="${address.id}"
                                        th:text="${address.merchantAddress}"
                                        th:selected="${address.id == food.merchantAddressId}">
                                </option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-semibold">Danh mục món ăn <span class="text-danger">*</span></label>
                            <div class="p-3 bg-light rounded-3 border-0">
                                <div th:each="category : ${categories}" class="form-check form-check-inline me-4 mb-2">
                                    <input class="form-check-input"
                                           type="checkbox"
                                           name="categoryIds"
                                           th:id="'category-' + ${category.id}"
                                           th:value="${category.id}"
                                           th:checked="${food.categoryIds != null and food.categoryIds.contains(category.id)}">
                                    <label class="form-check-label fw-medium" th:for="'category-' + ${category.id}" th:text="${category.categoryName}">
                                        Category
                                    </label>
                                </div>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="preparationTime" class="form-label fw-semibold">
                                Thời gian chuẩn bị <span class="text-danger">*</span>
                            </label>

                            <div class="d-flex align-items-center gap-2">
                                <input type="number"
                                       class="form-control bg-light border-0"
                                       id="preparationTime"
                                       name="preparationTime"
                                       min="0"
                                       style="max-width: 140px; height: 42px;"
                                       th:value="${food.preparationTime}"
                                       required>

                                <span class="text-muted fw-semibold">phút</span>
                            </div>
                        </div>

                        <div class="mb-0">
                            <label for="foodNote" class="form-label fw-semibold">Mô tả / Ghi chú món ăn</label>
                            <textarea class="form-control bg-light border-0" id="foodNote" name="foodNote" rows="4" th:text="${food.foodNote}" placeholder="Mô tả chi tiết về thành phần, hương vị..."></textarea>
                        </div>
                    </div>

                </div>

                <!-- CỘT PHẢI: GIÁ CẢ & QUẢN LÝ HÌNH ẢNH -->
                <div class="col-lg-5 d-flex flex-column gap-4">

                    <!-- Card 2: Giá & Phí -->
                    <div class="merchant-page-card p-4">
                        <h5 class="fw-bold text-dark mb-4 pb-2 border-bottom">
                            <i class="bi bi-tag text-danger me-2"></i>Giá & Phí dịch vụ
                        </h5>

                        <div class="mb-3">
                            <label for="price" class="form-label fw-semibold">Giá bán chính thức <span class="text-danger">*</span></label>
                            <div class="input-group">
                                <input type="number" class="form-control bg-light border-0" id="price" name="price" min="0" step="0.01" th:value="${food.price}" required>
                                <span class="input-group-text bg-light border-0 text-muted fw-semibold">vnđ</span>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="discountPrice" class="form-label fw-semibold">Giá khuyến mãi (nếu có)</label>
                            <div class="input-group">
                                <input type="number" class="form-control bg-light border-0" id="discountPrice" name="discountPrice" min="0" step="0.01" th:value="${food.discountPrice}">
                                <span class="input-group-text bg-light border-0 text-muted fw-semibold">vnđ</span>
                            </div>
                        </div>

                        <div class="mb-0">
                            <label for="serviceFee" class="form-label fw-semibold">Phí dịch vụ</label>
                            <div class="input-group">
                                <input type="number" class="form-control bg-light border-0" id="serviceFee" name="serviceFee" min="0" step="0.01" th:value="${food.serviceFee}">
                                <span class="input-group-text bg-light border-0 text-muted fw-semibold">vnđ</span>
                            </div>
                        </div>
                    </div>

                    <!-- Card 3: Quản lý hình ảnh -->
                    <div class="merchant-page-card p-4">
                        <h5 class="fw-bold text-dark mb-4 pb-2 border-bottom">
                            <i class="bi bi-images text-danger me-2"></i>Hình ảnh món ăn
                        </h5>

                        <!-- Danh sách ảnh hiện tại -->
                        <div class="mb-3">
                            <label class="form-label fw-semibold text-muted font-size-14">Ảnh đang sử dụng</label>

                            <div class="d-flex flex-wrap gap-3">
                                <div th:if="${food.imageUrls != null and !#lists.isEmpty(food.imageUrls)}"
                                     th:each="imageUrl, iterStat : ${food.imageUrls}"
                                     class="position-relative border rounded-3 overflow-hidden bg-light shadow-sm"
                                     style="width: 90px; height: 90px;">

                                    <img th:src="${imageUrl}"
                                         alt="Ảnh món ăn"
                                         class="w-100 h-100 object-fit-cover">

<!--                                    &lt;!&ndash; Badge ảnh chính cho ảnh đầu tiên &ndash;&gt;-->
<!--                                    <span th:if="${iterStat.first}"-->
<!--                                          class="position-absolute top-0 start-0 bg-danger text-white px-1 font-size-10 fw-bold rounded-bottom-end">-->
<!--                                        -->
<!--                                    </span>-->
                                </div>

                                <div th:unless="${food.imageUrls != null and !#lists.isEmpty(food.imageUrls)}"
                                     class="text-muted small italic p-3 bg-light w-100 text-center rounded-3">
                                    Chưa có hình ảnh nào cho món này.
                                </div>
                            </div>
                        </div>

                        <!-- Ô Upload ảnh mới -->
                        <div>
                            <label for="image" class="form-label fw-semibold">Tải lên ảnh mới</label>
                            <div class="border border-2 border-dashed rounded-3 p-3 text-center bg-light bg-opacity-50">
                                <i class="bi bi-cloud-arrow-up fs-2 text-danger"></i>
                                <p class="small text-muted mb-2">Bấm để chọn hoặc kéo thả ảnh vào đây</p>
                                <input type="file" class="form-control form-control-sm" id="image" name="images" accept=".jpg,.jpeg,.png,.webp">
                            </div>
                        </div>
                    </div>

                </div>
            </div>

            <!-- NÚT THAO TÁC CUỐI TRANG -->
            <div class="d-flex justify-content-end gap-3 mt-4 pt-3 border-top">
                <a th:href="@{/merchant/foods/{id}(id=${food.id})}" class="btn btn-light rounded-pill px-4 py-2 fw-semibold border">
                    Hủy
                </a>
                <button type="submit" id="submitButton" class="btn btn-danger rounded-pill px-5 py-2 fw-bold shadow-sm d-inline-flex align-items-center gap-2">
                    <i class="bi bi-check-lg"></i>
                    <span>Lưu thay đổi</span>
                </button>
            </div>
        </form>
    </section>
</div>

<script>
    const form = document.getElementById('foodEditForm');
    const submitButton = document.getElementById('submitButton');

    function buildAuthHeaders() {
        const token = localStorage.getItem('accessToken');
        const headers = {};

        if (token) {
            headers.Authorization = `Bearer ${token}`;
        }

        return headers;
    }

    form.addEventListener('submit', async function (event) {
        event.preventDefault();

        const foodId = form.dataset.foodId;
        const formData = new FormData(form);

        submitButton.disabled = true;
        submitButton.innerHTML = '<span class="spinner-border spinner-border-sm me-1"></span>Đang lưu...';

        try {
            const response = await fetch(`/api/merchant/foods/${foodId}`, {
                method: 'PUT',
                credentials: 'include',
                headers: buildAuthHeaders(),
                body: formData
            });

            if (response.status === 401 || response.status === 403) {
                window.showMerchantNotice?.({
                    variant: 'danger',
                    title: 'Phiên đăng nhập',
                    message: 'Phiên đăng nhập đã hết hạn. Vui lòng đăng nhập lại.'
                });
                window.location.href = '/login';
                return;
            }

            if (!response.ok) {
                let message = 'Không thể lưu thay đổi.';
                try {
                    const errorData = await response.json();
                    if (errorData.message) {
                        message = errorData.message;
                    }
                } catch (error) {
                    console.error(error);
                }

                window.showMerchantNotice?.({
                    variant: 'danger',
                    title: 'Không thể lưu thay đổi',
                    message
                });
                return;
            }

            window.showMerchantNotice?.({
                variant: 'success',
                title: 'Cập nhật món ăn thành công',
                message: 'Đang quay về trang chi tiết món ăn...'
            });
            setTimeout(() => {
                window.location.href = `/merchant/foods/${foodId}`;
            }, 900);
        } catch (error) {
            console.error('Lỗi khi cập nhật món ăn:', error);
            window.showMerchantNotice?.({
                variant: 'danger',
                title: 'Có lỗi xảy ra',
                message: 'Không thể cập nhật món ăn. Vui lòng thử lại.'
            });
        } finally {
            submitButton.disabled = false;
            submitButton.innerHTML = '<i class="bi bi-check-lg me-1"></i>Lưu thay đổi';
        }
    });
</script>
</body>
</html>
