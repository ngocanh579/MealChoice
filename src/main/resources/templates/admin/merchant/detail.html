<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Chi tiết Merchant</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>

<body>

<!-- Navbar -->
<div th:replace="~{layout/navbar :: navbar}"></div>

<div class="container py-4">

    <!-- Header -->
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h3 class="fw-bold mb-1">Chi tiết Merchant</h3>
            <p class="text-muted mb-0">
                Xem thông tin chi tiết của merchant.
            </p>
        </div>

        <a href="/admin/merchants"
           class="btn btn-outline-secondary">
            <i class="bi bi-arrow-left me-1"></i>
            Quay lại
        </a>
    </div>

    <!-- Thông tin Merchant -->
    <div class="card border-0 shadow-sm mb-4">

        <div class="card-header bg-white py-3">
            <h5 class="fw-bold mb-0">
                <i class="bi bi-shop me-2"></i>
                Thông tin nhà hàng
            </h5>
        </div>

        <div class="card-body">

            <div class="row g-4">

                <!-- Tên nhà hàng -->
                <div class="col-md-6">
                    <label class="text-muted small">
                        Tên nhà hàng
                    </label>

                    <div class="fw-semibold"
                         th:text="${merchant.merchantRestaurantName}">
                    </div>
                </div>

                <!-- Email -->
                <div class="col-md-6">
                    <label class="text-muted small">
                        Email
                    </label>

                    <div class="fw-semibold"
                         th:text="${merchant.merchantEmail}">
                    </div>
                </div>

                <!-- Số điện thoại -->
                <div class="col-md-6">
                    <label class="text-muted small">
                        Số điện thoại
                    </label>

                    <div class="fw-semibold"
                         th:text="${merchant.merchantPhone}">
                    </div>
                </div>

                <!-- Trạng thái -->
                <div class="col-md-6">
                    <label class="text-muted small d-block">
                        Trạng thái
                    </label>

                    <span th:if="${merchant.merchantStatus == T(vn.codegyme.meal_choice.entity.MerchantStatus).PENDING}"
                          class="badge bg-warning text-dark">
                        Chờ duyệt
                    </span>

                    <span th:if="${merchant.merchantStatus == T(vn.codegyme.meal_choice.entity.MerchantStatus).APPROVED}"
                          class="badge bg-success">
                        Đã duyệt
                    </span>

                    <span th:if="${merchant.merchantStatus == T(vn.codegyme.meal_choice.entity.MerchantStatus).REJECTED}"
                          class="badge bg-danger">
                        Từ chối
                    </span>

                    <span th:if="${merchant.merchantStatus == T(vn.codegyme.meal_choice.entity.MerchantStatus).BLOCKED}"
                          class="badge bg-secondary">
                        Đã khóa
                    </span>
                </div>

                <!-- Đối tác thân thiết -->
                <div class="col-md-6">
                    <label class="text-muted small d-block">
                        Đối tác thân thiết
                    </label>

                    <span th:if="${merchant.trustedPartner}"
                          class="badge bg-primary">
                        Đối tác thân thiết
                    </span>

                    <span th:unless="${merchant.trustedPartner}"
                          class="text-muted">
                        Không
                    </span>
                </div>

            </div>

        </div>
    </div>

    <!-- Địa chỉ -->
    <div class="card border-0 shadow-sm mb-4">

        <div class="card-header bg-white py-3">
            <h5 class="fw-bold mb-0">
                <i class="bi bi-geo-alt me-2"></i>
                Địa chỉ nhà hàng
            </h5>
        </div>

        <div class="card-body">

            <div th:if="${#lists.isEmpty(merchant.addresses)}"
                 class="text-center text-muted py-4">

                <i class="bi bi-geo-alt fs-2 d-block mb-2"></i>

                Merchant chưa có địa chỉ.

            </div>

            <div th:unless="${#lists.isEmpty(merchant.addresses)}">

                <div class="table-responsive">

                    <table class="table table-hover align-middle mb-0">

                        <thead class="table-light">
                        <tr>
                            <th>STT</th>
                            <th>Địa chỉ</th>
                            <th>Giờ mở cửa</th>
                            <th>Giờ đóng cửa</th>
                        </tr>
                        </thead>

                        <tbody>

                        <tr th:each="address, stat : ${merchant.addresses}">

                            <td th:text="${stat.count}"></td>

                            <td th:text="${address.merchantAddress}">
                            </td>

                            <td th:text="${address.merchantOpenTime}">
                            </td>

                            <td th:text="${address.merchantCloseTime}">
                            </td>

                        </tr>

                        </tbody>

                    </table>

                </div>

            </div>

        </div>
    </div>

    <!-- Thao tác -->
    <div class="card border-0 shadow-sm">

        <div class="card-body">

            <h5 class="fw-bold mb-3">
                Thao tác
            </h5>

            <div class="d-flex gap-2 flex-wrap">

                <!-- Duyệt -->
                <form th:if="${merchant.merchantStatus == T(vn.codegyme.meal_choice.entity.MerchantStatus).PENDING}"
                      th:action="@{/admin/merchants/{id}/approve(id=${merchant.id})}"
                      method="post">

                    <button type="submit"
                            class="btn btn-success">
                        <i class="bi bi-check-circle me-1"></i>
                        Duyệt merchant
                    </button>

                </form>

                <!-- Từ chối -->
                <form th:if="${merchant.merchantStatus == T(vn.codegyme.meal_choice.entity.MerchantStatus).PENDING}"
                      th:action="@{/admin/merchants/{id}/reject(id=${merchant.id})}"
                      method="post">

                    <button type="submit"
                            class="btn btn-danger">
                        <i class="bi bi-x-circle me-1"></i>
                        Từ chối
                    </button>

                </form>

                <!-- Khóa -->
                <form th:if="${merchant.merchantStatus == T(vn.codegyme.meal_choice.entity.MerchantStatus).APPROVED}"
                      th:action="@{/admin/merchants/{id}/toggle-lock(id=${merchant.id})}"
                      method="post">

                    <button type="submit"
                            class="btn btn-outline-danger">
                        <i class="bi bi-lock me-1"></i>
                        Khóa merchant
                    </button>

                </form>

                <!-- Mở khóa -->
                <form th:if="${merchant.merchantStatus == T(vn.codegyme.meal_choice.entity.MerchantStatus).BLOCKED}"
                      th:action="@{/admin/merchants/{id}/toggle-lock(id=${merchant.id})}"
                      method="post">

                    <button type="submit"
                            class="btn btn-outline-success">
                        <i class="bi bi-unlock me-1"></i>
                        Mở khóa merchant
                    </button>

                </form>

                <!-- Duyệt đối tác -->
                <form th:if="${merchant.merchantStatus == T(vn.codegyme.meal_choice.entity.MerchantStatus).APPROVED
                             and !merchant.trustedPartner}"
                      th:action="@{/admin/merchants/{id}/trusted-partner(id=${merchant.id})}"
                      method="post">

                    <button type="submit"
                            class="btn btn-primary">
                        <i class="bi bi-star me-1"></i>
                        Duyệt đối tác thân thiết
                    </button>

                </form>

                <!-- Bỏ đối tác -->
                <form th:if="${merchant.trustedPartner}"
                      th:action="@{/admin/merchants/{id}/trusted-partner/remove(id=${merchant.id})}"
                      method="post">

                    <button type="submit"
                            class="btn btn-outline-primary">
                        <i class="bi bi-star-fill me-1"></i>
                        Bỏ đối tác thân thiết
                    </button>

                </form>

            </div>

        </div>

    </div>

</div>

<!-- Footer -->
<div th:replace="~{layout/footer :: footer}"></div>
<!-- POPUP -->
<div th:replace="~{layout/merchant-blocked-modal :: merchantBlockedModal}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js">
</script>

</body>
</html>
