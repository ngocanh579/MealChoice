<!-- Fragment Danh sách Coupon -->
<div th:fragment="couponList" class="py-3" xmlns:th="http://www.thymeleaf.org">
    <div class="card border-0 shadow-sm rounded-4 overflow-hidden bg-white p-4">
        <h5 class="fw-bold text-dark mb-3">
            <i class="bi bi-ticket-perforated me-2 text-danger"></i>Mã giảm giá & Ưu đãi khả dụng
        </h5>
        <div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-3">
            <!-- Coupon 1 -->
            <div class="col">
                <div class="d-flex align-items-center bg-light border border-light-subtle rounded-3 p-3 position-relative overflow-hidden shadow-xs hover-shadow transition-hover" style="border-left: 5px solid #ff4b2b !important;">
                    <div class="pe-3 border-end border-dashed border-secondary border-opacity-25 text-center d-flex flex-column justify-content-center" style="min-width: 80px;">
                        <span class="fw-bold text-danger fs-5">20k</span>
                        <span class="text-muted fs-9 fw-semibold">GIẢM</span>
                    </div>
                    <div class="ps-3 flex-grow-1 overflow-hidden">
                        <h6 class="fw-bold text-dark mb-0 fs-7 text-truncate">Mã: MEALCHOICE20</h6>
                        <p class="text-muted fs-8 mb-1 text-truncate">Giảm 20k cho đơn từ 100k</p>
                        <button class="btn btn-outline-danger btn-xs rounded-pill px-2 py-0.5 fw-semibold fs-9" onclick="navigator.clipboard.writeText('MEALCHOICE20'); alert('Đã sao chép mã MEALCHOICE20!');">Lấy Mã</button>
                    </div>
                </div>
            </div>

            <!-- Coupon 2 -->
            <div class="col">
                <div class="d-flex align-items-center bg-light border border-light-subtle rounded-3 p-3 position-relative overflow-hidden shadow-xs hover-shadow transition-hover" style="border-left: 5px solid #10b981 !important;">
                    <div class="pe-3 border-end border-dashed border-secondary border-opacity-25 text-center d-flex flex-column justify-content-center" style="min-width: 80px;">
                        <span class="fw-bold text-success fs-5">FREE</span>
                        <span class="text-muted fs-9 fw-semibold">SHIP</span>
                    </div>
                    <div class="ps-3 flex-grow-1 overflow-hidden">
                        <h6 class="fw-bold text-dark mb-0 fs-7 text-truncate">Mã: FREESHIPMAX</h6>
                        <p class="text-muted fs-8 mb-1 text-truncate">Miễn phí giao hàng toàn thành phố</p>
                        <button class="btn btn-outline-success btn-xs rounded-pill px-2 py-0.5 fw-semibold fs-9" onclick="navigator.clipboard.writeText('FREESHIPMAX'); alert('Đã sao chép mã FREESHIPMAX!');">Lấy Mã</button>
                    </div>
                </div>
            </div>

            <!-- Coupon 3 (nếu có giảm giá) -->
            <div class="col" th:if="${food.discountPrice != null and food.price != null and food.price > 0}">
                <div class="d-flex align-items-center bg-light border border-light-subtle rounded-3 p-3 position-relative overflow-hidden shadow-xs hover-shadow transition-hover" style="border-left: 5px solid #f59e0b !important;">
                    <div class="pe-3 border-end border-dashed border-secondary border-opacity-25 text-center d-flex flex-column justify-content-center" style="min-width: 80px;">
                        <span class="fw-bold text-warning fs-5" th:text="${#numbers.formatDecimal((food.price - food.discountPrice) / food.price * 100, 0, 0)} + '%'">20%</span>
                        <span class="text-muted fs-9 fw-semibold">HOT</span>
                    </div>
                    <div class="ps-3 flex-grow-1 overflow-hidden">
                        <h6 class="fw-bold text-dark mb-0 fs-7 text-truncate">Mã: FOODHOT</h6>
                        <p class="text-muted fs-8 mb-1 text-truncate">Ưu đãi giảm trực tiếp theo món</p>
                        <button class="btn btn-outline-warning btn-xs rounded-pill px-2 py-0.5 fw-semibold fs-9" onclick="navigator.clipboard.writeText('FOODHOT'); alert('Đã sao chép mã FOODHOT!');">Lấy Mã</button>
                    </div>
                </div>
            </div>
            
            <!-- Default Coupon 3 fallback if no discount -->
            <div class="col" th:unless="${food.discountPrice != null and food.price != null and food.price > 0}">
                <div class="d-flex align-items-center bg-light border border-light-subtle rounded-3 p-3 position-relative overflow-hidden shadow-xs hover-shadow transition-hover" style="border-left: 5px solid #3b82f6 !important;">
                    <div class="pe-3 border-end border-dashed border-secondary border-opacity-25 text-center d-flex flex-column justify-content-center" style="min-width: 80px;">
                        <span class="fw-bold text-primary fs-5">10%</span>
                        <span class="text-muted fs-9 fw-semibold">GIẢM</span>
                    </div>
                    <div class="ps-3 flex-grow-1 overflow-hidden">
                        <h6 class="fw-bold text-dark mb-0 fs-7 text-truncate">Mã: NEWUSER</h6>
                        <p class="text-muted fs-8 mb-1 text-truncate">Giảm 10% cho thành viên mới</p>
                        <button class="btn btn-outline-primary btn-xs rounded-pill px-2 py-0.5 fw-semibold fs-9" onclick="navigator.clipboard.writeText('NEWUSER'); alert('Đã sao chép mã NEWUSER!');">Lấy Mã</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
