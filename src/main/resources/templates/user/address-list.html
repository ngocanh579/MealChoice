<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Địa chỉ giao hàng</title>

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>

<body class="d-flex flex-column min-vh-100">

<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="container py-4 flex-grow-1">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 class="h3 mb-0">
            Địa chỉ giao hàng
        </h1>

        <a th:href="@{/user/addresses/create}"
           class="btn btn-primary">
            Thêm địa chỉ
        </a>
    </div>

    <div th:if="${successMessage}"
         class="alert alert-success"
         th:text="${successMessage}">
    </div>

    <div th:if="${errorMessage}"
         class="alert alert-danger"
         th:text="${errorMessage}">
    </div>

    <div th:if="${#lists.isEmpty(addresses)}"
         class="alert alert-info">
        Bạn chưa có địa chỉ giao hàng.
    </div>

    <div class="row g-3"
         th:unless="${#lists.isEmpty(addresses)}">

        <div class="col-md-6"
             th:each="address : ${addresses}">

            <div class="card h-100 shadow-sm">

                <div class="card-body">

                    <div class="d-flex justify-content-between">

                        <h5 th:text="${address.contactName}">
                            Tên người nhận
                        </h5>

                        <span th:if="${address.isDefault}"
                              class="badge bg-success">
                            Mặc định
                        </span>

                    </div>

                    <p class="mb-2">
                        <strong>Số điện thoại:</strong>

                        <span th:text="${address.contactPhone}">
                            0987654321
                        </span>
                    </p>

                    <p class="mb-2">
                        <strong>Địa chỉ:</strong>

                        <span th:text="${address.fullAddress}">
                            Địa chỉ đầy đủ
                        </span>
                    </p>

                    <p th:if="${address.note != null
                               and !#strings.isEmpty(address.note)}">

                        <strong>Ghi chú:</strong>

                        <span th:text="${address.note}">
                            Ghi chú
                        </span>
                    </p>

                    <div class="d-flex gap-2">

                        <a th:href="@{/user/addresses/{id}/edit(id=${address.id})}"
                           class="btn btn-outline-primary">
                            Chỉnh sửa
                        </a>

                        <form th:action="@{/user/addresses/{id}/delete(id=${address.id})}"
                              method="post"
                              onsubmit="return confirm('Bạn có chắc chắn muốn xóa địa chỉ này?');">

                            <input type="hidden"
                                   th:if="${_csrf != null}"
                                   th:name="${_csrf.parameterName}"
                                   th:value="${_csrf.token}">

                            <button type="submit"
                                    class="btn btn-outline-danger">
                                Xóa
                            </button>
                        </form>

                    </div>

                </div>
            </div>

        </div>
    </div>

</main>

<div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
