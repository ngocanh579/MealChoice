<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thông tin cửa hàng - MealChoice</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link href="/css/style.css" rel="stylesheet">
</head>
<body class="mc-page" data-page="merchant-profile">
<div th:replace="~{layout/navbar :: navbar}"></div>
<main class="mc-shell mc-main" style="max-width:960px">
    <section class="mc-hero">
        <div style="display:flex;justify-content:space-between;gap:20px;align-items:center;flex-wrap:wrap">
            <div>
                <h1>Hồ sơ cửa hàng</h1>
                <p>Cập nhật thông tin khách hàng nhìn thấy khi lựa chọn nhà hàng.</p>
            </div>
            <div>
                <span id="merchantStatus" class="mc-badge status-PENDING">PENDING</span>
                <span id="loyalPartner" class="mc-badge status-APPROVED" hidden>⭐ Đối tác thân thiết</span>
            </div>
        </div>
    </section>

    <div id="pageAlert" class="mc-alert" role="alert"></div>
    <section class="mc-card">
        <form id="merchantProfileForm" class="mc-form-grid">
            <div class="mc-field">
                <label for="ownerName">Chủ cửa hàng</label>
                <input id="ownerName" data-always-disabled="true" disabled>
            </div>
            <div class="mc-field">
                <label for="restaurantName">Tên nhà hàng</label>
                <input id="restaurantName" name="restaurantName" required>
            </div>
            <div class="mc-field">
                <label for="email">Email</label>
                <input id="email" data-always-disabled="true" disabled>
            </div>
            <div class="mc-field">
                <label for="phone">Số điện thoại</label>
                <input id="phone" data-always-disabled="true" disabled>
            </div>
            <div class="mc-field mc-field-full">
                <label for="address">Địa chỉ cửa hàng</label>
                <input id="address" name="address" required>
            </div>
            <div class="mc-field">
                <label for="openTime">Giờ mở cửa</label>
                <input id="openTime" name="openTime" type="time" required>
            </div>
            <div class="mc-field">
                <label for="closeTime">Giờ đóng cửa</label>
                <input id="closeTime" name="closeTime" type="time" required>
            </div>
            <div class="mc-field-full mc-actions">
                <button class="mc-btn mc-btn-primary" type="submit">Lưu thông tin cửa hàng</button>
            </div>
        </form>
    </section>
</main>
<div th:replace="~{layout/footer :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/main.js"></script>
<script src="/js/merchant.js"></script>
</body>
</html>
